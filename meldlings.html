  { id: "leaden",   name: "Leaden",        art: "kingpin",  sev: 3, text: "Your multiplier is capped at x4.",    rule: { multCap: 4 } },
  { id: "puritan",  name: "Puritan",       art: "jokester", sev: 3, text: "Pairs score nothing at all.",         rule: { noPairs: true } , align: "S" },
  { id: "drought",  name: "Drought",       art: "deadwood", sev: 3, text: "One fewer deal, and no mulligans.",    rule: { dealBonus: -1, mulliganBonus: -9 } , align: "H" },
  { id: "hush",     name: "The Hush",      art: "shuffler", sev: 2, text: "Charms score nothing this round.", rule: { noCharms: true }, align: "H" },
  { id: "levy",     name: "The Levy",      art: "kingpin",  sev: 2, text: "You start the round with no Glim.",  rule: { levy: true }, align: "C" },
  { id: "shears",   name: "Shears",        art: "jokester", sev: 3, text: "Your deck is cut to 30 cards for this round.", rule: { roundTrim: 99 }, align: "D" },
  { id: "eclipse",  name: "Eclipse",       art: "kingpin",  sev: 3, text: "Fifteens score 1, flushes and nobs score nothing.", rule: { fifteenPoints: 1, noFlush: true, noNobs: true } },
];
const ACT_SEVERITY = [1, 1, 2, 2, 3];

function planBosses() {
  const used = new Set();
  const plan = [];
  for (let act = 1; act <= CRIB_ACTS; act++) {
    const sev = ACT_SEVERITY[act - 1];
    let band = BOSS_POOL.filter((b) => b.sev === sev && !used.has(b.id));
    if (!band.length) band = BOSS_POOL.filter((b) => !used.has(b.id));
    const pick = band[Math.floor(Math.random() * band.length)];
    used.add(pick.id);
    plan.push(pick);
  }
  return plan;
}

/* ---------------------------------------------------------------- run */
class CribRun {
  constructor(meldling, street) {
    this.street = street || { id: 1, name: "First Street", mods: {} };
    this.meldling = meldling;
    this.deck = CRIB_DECKS[meldling];
    this.act = 1; this.round = 1;
    this.essence = 6;
    /* Score above the target is no longer wasted: it banks as Surplus, and
       Surplus buys the right to skip a round. */
    this.surplus = 0;
    this.skips = 0;
    this.charms = [];
    this.levels = { fifteen: 0, pair: 0, run: 0, flush: 0 };
    /* Gilding a RANK is this game's answer to Balatro's card enhancements:
       every gilded card adds base whenever it appears in a scoring hand. */
    this.gilded = {};
    /* The deck is a persistent object you modify across the run, and each round
       shuffles YOUR deck and deals it down without reshuffling. That's what makes
       deck knowledge a skill and deck-building passives possible. */
    this.cards = cDeck();
    const mim = (this.deck.rule && this.deck.rule.startMimics) || 0;
    for (let i = 0; i < mim; i++) {
      const pick = Math.floor(Math.random() * this.cards.length);
      this.cards[pick] = Object.assign({}, this.cards[pick], { enh: "chameleon" });
    }
    const trim = ((this.deck.rule && this.deck.rule.deckTrim) || 0) +
                 ((this.street.mods && this.street.mods.deckTrim) || 0);
    if (trim) this.removeRandom(trim);
    this.bossPlan = planBosses();
    this.planWagers();
  }

  deckSize() { return this.cards.length; }

  addCards(list) { for (const c of list) this.cards.push(Object.assign({}, c)); }

  removeWhere(pred) {
    const before = this.cards.length;
    this.cards = this.cards.filter((c) => !pred(c));
    return before - this.cards.length;
  }

  removeRandom(n) {
    const d = cShuf(this.cards.slice());
    this.cards = d.slice(n);
    return n;
  }

  /* Rank histogram, for the deck viewer. */
  histogram() {
    const h = {};
    for (const c of this.cards) h[c.rank] = (h[c.rank] || 0) + 1;
    return h;
  }

  levelCostFor(cat) { return levelCost(this.levels[cat]); }
  gildCostFor(rank) { return 6 + (this.gilded[rank] || 0) * 5; }
  gild(rank) {
    const c = this.gildCostFor(rank);
    if (this.essence < c) return false;
    this.essence -= c;
    this.gilded[rank] = (this.gilded[rank] || 0) + 1;
    return true;
  }
  gildTotal() { return Object.values(this.gilded).reduce((a, b) => a + b, 0); }
  buyLevel(cat) {
    const c = this.levelCostFor(cat);
    if (this.essence < c) return false;
    this.essence -= c;
    this.levels[cat]++;
    return true;
  }
  roundIndex() { return (this.act - 1) * CRIB_ROUNDS + this.round; }
  target() {
    const mul = (this.street && this.street.mods.targetMul) || 1;
    if (this.isWager())
      return Math.round(CRIB_LADDER.baseTarget *
        Math.pow(CRIB_LADDER.growth, this.roundIndex() - 1) * mul * 0.55);
    return Math.round(CRIB_LADDER.baseTarget *
      Math.pow(CRIB_LADDER.growth, this.roundIndex() - 1) * mul);
  }
  /* A Wager can appear on any non-Spoiler round. It is optional, brutal, and it
     pays in a system unlock rather than Glim. */
  /* Wagers are placed once, at run start, on random non-Spoiler rounds. */
  planWagers() {
    this.wagerAt = {};
    if (typeof Achv === "undefined" || !Achv.lockedSystems().length) return;
    const slots = [];
    for (let a = 1; a <= CRIB_ACTS; a++)
      for (let r = 2; r < CRIB_ROUNDS; r++) slots.push(`${a}-${r}`);
    cShuf(slots);
    const n = 1 + (Math.random() < 0.45 ? 1 : 0);      // one, sometimes two
    for (let i = 0; i < n && i < slots.length; i++) this.wagerAt[slots[i]] = true;
  }
  isWager() { return !this.isBoss() && !!(this.wagerAt || {})[`${this.act}-${this.round}`]; }

  isBoss() {
    if (this.round === CRIB_ROUNDS) return true;
    return !!(this.street && this.street.mods.extraSpoiler) && this.round === 3;
  }
  slots() {
    const bonus = (typeof Achv !== "undefined" && Achv.hasSystem("sixth_slot")) ? 1 : 0;
    return Math.max(3, CHARM_SLOTS + bonus + ((this.street && this.street.mods.slots) || 0));
  }
  boss() {
    if (!this.isBoss()) return null;
    if (this.round === 3) return BOSS_POOL[(this.act * 7 + 3) % BOSS_POOL.length];
    return this.bossPlan[this.act - 1];
  }

  /* All passive rules merged: deck + charms + boss. */
  rules() {
    const r = { nobsPoints: 1, fifteenPoints: 2, flushNeed: 4, recuts: 0,
                dealBonus: 0, dealtBonus: 0, keepPenalty: 0,
                mulliganBonus: 0, cribKeep: 4, keepBonus: 0, pairScale: 1,
                roundTrim: 0, multCap: 0, deadSuit: null };
    const merge = (src) => { for (const k in src) {
      if (typeof src[k] === "number" && k in r) r[k] =
        (k === "flushNeed" || k === "fifteenPoints" || k === "nobsPoints" || k === "cribKeep")
          ? src[k]
          : (k === "pairScale" ? r[k] * src[k] : r[k] + src[k]);
      else r[k] = src[k];
    } };
    if (this.deck.rule) merge(this.deck.rule);
    for (const c of this.charms) if (c.rule) merge(c.rule);
    const b = this.boss();
    if (b) merge(b.rule);
    return r;
  }

  /* Deck bonus behaves as a permanent charm. */
  activeCharms() {
    const list = this.charms.slice();
    if (this.deck.charm) list.unshift(Object.assign({ name: this.deck.name, tier: 0 }, this.deck.charm));
    return list;
  }

  advance() {
    this.round++;
    if (this.round > CRIB_ROUNDS) { this.round = 1; this.act++; }
    return this.act > CRIB_ACTS;
  }

  isFull() { return this.charms.length >= this.slots(); }
  /* Charms resolve left to right, so a x1.5 placed before an additive charm
     produces a different total than the same pair reversed. Order is a real
     optimisation layer — it just needed to be reachable. */
  moveCharm(from, to) {
    if (from === to || from < 0 || to < 0) return false;
    if (from >= this.charms.length || to >= this.charms.length) return false;
    const [c] = this.charms.splice(from, 1);
    this.charms.splice(to, 0, c);
    return true;
  }

  /* What would this hand score with the charms in a given order? Lets the UI
     show the gain before you commit to a rearrangement. */
  scoreWithOrder(round, hand, order) {
    const saved = this.charms;
    this.charms = order.filter((i) => i >= 0 && i < saved.length).map((i) => saved[i]);
    const total = round.runCount(hand).total;
    this.charms = saved;
    return total;
  }

  /* The best arrangement of what you own, for the "auto-sort" button. */
  bestOrder(round, hand) {
    const n = this.charms.length;
    if (n < 2 || n > 6) return null;
    const idx = [...Array(n).keys()];
    let best = null;
    const permute = (arr, cur) => {
      if (!arr.length) {
        const t = this.scoreWithOrder(round, hand, cur);
        if (!best || t > best.total) best = { order: cur.slice(), total: t };
        return;
      }
      for (let i = 0; i < arr.length; i++)
        permute(arr.slice(0, i).concat(arr.slice(i + 1)), cur.concat([arr[i]]));
    };
    permute(idx, []);
    return best;
  }

  sell(id) {
    const i = this.charms.findIndex((c) => c.id === id);
    if (i < 0) return 0;
    const refund = Math.max(2, Math.floor(this.charms[i].cost / 2));
    this.charms.splice(i, 1);
    this.essence += refund;
    return refund;
  }

  /* Roll by rarity first, then pick within that band — so legendaries stay rare
     regardless of how many exist. */
  rollShop(n = 3) {
    const owned = new Set(this.charms.map((c) => c.id));
    const pool = CCHARMS.filter((c) => !owned.has(c.id));
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 200) {
      const rar = rollRarity();
      const band = pool.filter((c) => (c.rarity || "common") === rar && !out.includes(c));
      const from = band.length ? band : pool.filter((c) => !out.includes(c));
      if (!from.length) break;
      out.push(from[Math.floor(Math.random() * from.length)]);
    }
    return out;
  }

  openShop() {
    this.shopState = {
      offer: this.rollShop(3),
      cards: (typeof Achv !== "undefined" && Achv.hasSystem("deep_stall"))
        ? [rollCardOffer(), rollCardOffer(), rollCardOffer(), rollCardOffer()]
        : [rollCardOffer(), rollCardOffer(), rollCardOffer()],
      rerolls: 0,
    };
    return this.shopState;
  }

  buyCard(entry) {
    if (this.essence < entry.cost) return false;
    this.essence -= entry.cost;
    this.cards.push(Object.assign({}, entry.card));
    return true;
  }
  rerollCost() { return 3 + 2 * ((this.shopState && this.shopState.rerolls) || 0); }
  reroll() {
    const c = this.rerollCost();
    if (this.essence < c) return false;
    this.essence -= c;
    this.shopState.rerolls++;
    this.shopState.offer = this.rollShop(3);
    this.shopState.cards = [rollCardOffer(), rollCardOffer(), rollCardOffer()];
    return true;
  }

  shopOffer(n = 3) { return this.rollShop(n); }

  /* What carried the whole run? */
  runMVP() {
    const c = this.contribRun || {};
    let best = null;
    for (const k in c) if (!best || c[k] > c[best]) best = k;
    return best ? { name: best, points: Math.round(c[best]) } : null;
  }
}

/* ---------------------------------------------------------------- round */
class CribRound {
  constructor(run) {
    this.run = run;
    this.mods = run.rules();
    this.target = run.target();
    this.dealsLeft = CRIB_DEALS + this.mods.dealBonus;
    this.dealIndex = 0;
    this.score = 0;
    this.crib = [];
    this.over = false; this.won = false;
    this.stock = cShuf(run.cards.slice());     // YOUR deck, dealt down once
    if (this.mods.roundTrim === 99) this.stock = this.stock.slice(0, 30);
    else if (this.mods.roundTrim) this.stock = this.stock.slice(this.mods.roundTrim);
    if (this.mods.levy) this.run.essence = 0;
    if (this.mods.deadSuitRandom)
      this.mods.deadSuit = ["S", "H", "C", "D"][Math.floor(Math.random() * 4)];
    this.startingStock = this.stock.length;
    this.seen = [];                             // everything revealed this round
    this.dealt = null; this.starter = null; this.starter2 = null;
    this.recutsLeft = 0;
    this.wager = run.isWager() ? { kind: "exact" } : null;
    this.mulligansLeft = Math.max(0, BASE_MULLIGANS + this.mods.mulliganBonus);
    this.startMulligans = this.mulligansLeft;
    this.cycle = 1;
    this.used = [];
    this.startMulligans = this.mulligansLeft;
    this.outOfCards = false;
    this.used = [];
    this.phase = "deal";      // deal -> keep -> counted
    this.lastCount = null;
  }

  keepCount() { return Math.max(2, CRIB_KEEP + this.mods.keepBonus - this.mods.keepPenalty); }
  dealtCount() { return CRIB_DEALT + this.mods.dealtBonus - this.mods.keepPenalty; }

  needed() { return this.dealtCount() + (this.mods.doubleCut ? 2 : 1); }

  /* Real cribbage order: you are dealt six, you commit four, and ONLY THEN is the
     starter cut. That is what makes the keep an expected-value decision instead of
     a lookup — and it turns the cut into an anticipation beat. */
  /* A card you have seen does not come back until the deck is spent. When it is
     spent, everything used is gathered and reshuffled — a new cycle. The round now
     ends on deals, not on running dry. */
  recycle() {
    const back = (this.used || []).concat(this.burned || []);
    if (!back.length) return false;
    /* Gathering the deck costs you a deal. Without that, thinning your deck would
       be pure upside — you'd simply meet your good cards more often. */
    this.stock = cShuf(this.stock.concat(back));
    this.used = [];
    this.burned = [];
    this.seen = [];
    this.cycle = (this.cycle || 1) + 1;
    this.dealsLeft = Math.max(0, this.dealsLeft - 1);
    this.recycled = true;
    return this.dealsLeft > 0;
  }

  newDeal() {
    if (this.over || this.dealsLeft <= 0) return null;
    if (this.stock.length < this.needed()) this.recycle();
    if (this.stock.length < this.needed()) { this.outOfCards = true; this.settle(); return null; }
    this.dealt = this.stock.splice(0, this.dealtCount());
    this.starter = null;
    this.starter2 = null;
    this.seen.push(...this.dealt);
    this.recutsLeft = this.mods.recuts;
    this.phase = "keep";
    // Foresight reverses the order back, as a paid advantage
    if (this.mods.foresight) this.cutStarter();
    return this.dealt;
  }

  cutStarter() {
    if (this.starter) return this.starter;

      lead: ["d4 . f4 a4 . g4 f4 .", "a#3 . d4 f4 . e4 d4 .", "c4 . e4 g4 . f4 e4 .", "a3 . c4 e4 . d4 . ."],

      drums: ["k . h s . h k x", "k . h s . h k x", "k . h s . h k x", "k . h s h h s x"],
      arp: ["d4 f4 a4 d5 a4 f4 d4 f4", "a#3 d4 f4 a#4 f4 d4 a#3 d4",
            "c4 e4 g4 c5 g4 e4 c4 e4", "a3 c4 e4 a4 e4 c4 a3 c4"],
    },
    boss: {
      bpm: 150, bars: 4,
      lead: ["e4 f4 e4 . b3 . e4 .", "a#3 b3 a#3 . f3 . a#3 .", "d4 d#4 d4 . a3 . d4 .", "c4 b3 c4 . g3 . b3 ."],
      bass: ["e2 e2 e2 . f2 . e2 .", "e2 e2 e2 . a#2 . e2 .", "d2 d2 d2 . d#2 . d2 .", "c2 c2 c2 . b1 . c2 ."],
      drums: ["k h s h k h s x", "k h s h k h s x", "k h s h k h s x", "k h s s x x s x"],
      arp: ["e4 g4 b4 e5 b4 g4 e4 g4", "f4 a4 c5 f5 c5 a4 f4 a4",
            "d4 f4 a4 d5 a4 f4 d4 f4", "c4 d#4 g4 c5 g4 d#4 c4 d#4"],
    },
  };

  let musicTimer = null, musicName = null, step = 0, nextTime = 0;

  function playMusic(name) {
    init();
    if (musicName === name) return;
    stopMusic();
    musicName = name;
    const T = TRACKS[name];
    if (!T) return;
    step = 0;
    nextTime = now() + 0.08;
    const stepDur = (60 / T.bpm) / 2;             // eighth notes
    const total = T.bars * 8;

    const tokens = (row, i) => (row ? row[Math.floor(i / 8) % row.length].split(/\s+/)[i % 8] : ".");

    const schedule = () => {
      if (musicName !== name) return;
      while (nextTime < now() + 0.35) {
        const i = step % total;
        const at = nextTime;
        const L = tokens(T.lead, i), B = tokens(T.bass, i),
              D = tokens(T.drums, i), A = tokens(T.arp, i), P = tokens(T.pad, i);
        if (L && L !== "." && L !== "-")
          voice(hz(L), stepDur * 1.7, { at, type: "square", gain: 0.075, detune: 9,
            decay: stepDur * 1.7, send: 0.28, bus: musicGain, vibrato: { hz: 5, cents: 10 } });
        if (B && B !== "." && B !== "-")
          voice(hz(B), stepDur * 1.5, { at, type: "triangle", gain: 0.19, decay: stepDur * 1.4, bus: musicGain });
        if (A && A !== "." && A !== "-")
          voice(hz(A), stepDur * 0.8, { at, type: "square", gain: 0.035, send: 0.2, bus: musicGain });
        if (P && P !== "." && P !== "-")
          voice(hz(P), stepDur * 7, { at, type: "sawtooth", gain: 0.026, detune: 12,
            attack: 0.15, decay: stepDur * 7, bus: musicGain });
        if (D === "k") kick({ at, bus: musicGain, gain: 0.34 });
        else if (D === "s") snare({ at, bus: musicGain, gain: 0.13 });
        else if (D === "h") hat({ at, bus: musicGain, gain: 0.05 });
        else if (D === "x") { snare({ at, bus: musicGain, gain: 0.13 }); hat({ at, bus: musicGain, gain: 0.05 }); }
        nextTime += stepDur;
        step++;
      }
      musicTimer = setTimeout(schedule, 60);
    };
    schedule();
  }

  function stopMusic() {
    musicName = null;
    if (musicTimer) clearTimeout(musicTimer);
    musicTimer = null;
  }

  /* Music proximity: the closer you are to the target, the more the track opens.
     A closed filter at 10% and a bright, wide one at 99% carries the whole round's
     tension for almost nothing. */
  let musicFilter = null, musicProx = 0;
  function ensureMusicFilter() {
    if (musicFilter || !ctx) return musicFilter;
    musicFilter = ctx.createBiquadFilter();
    musicFilter.type = "lowpass";
    musicFilter.frequency.value = 1400;
    musicFilter.Q.value = 0.8;
    musicGain.disconnect();
    musicGain.connect(musicFilter);
    musicFilter.connect(master);
    return musicFilter;
  }
  function setProximity(p) {
    init();
    const f = ensureMusicFilter();
    if (!f) return;
    const L = Math.max(0, Math.min(1, p));
    musicProx = L;
    const t = now();
    // 1.2kHz when you're nowhere near, 16kHz when you're on the line
    f.frequency.linearRampToValueAtTime(1200 + 14800 * Math.pow(L, 1.4), t + 0.5);
    f.Q.linearRampToValueAtTime(0.8 + 2.4 * L, t + 0.5);
    musicGain.gain.linearRampToValueAtTime(0.30 + 0.10 * L, t + 0.5);
  }

  /* The Crib is a different kind of event, so it gets a different voice:
     lower, rounder, plucked rather than struck. */
  function cribTick(index) {
    const semi = [0, 3, 5, 7, 10, 12, 15, 17][Math.min(index, 7)];
    const f = 196 * Math.pow(2, semi / 12);
    duckRamp(0.35, 0.09);
    voice(f, 0.34, { type: "triangle", gain: 0.15, detune: 5, decay: 0.32, send: 0.4 });
    voice(f * 2, 0.16, { type: "sine", gain: 0.07, delay: 0.02 });
    noise(0.02, { freq: 900, filter: "lowpass", gain: 0.05 });
  }

  function duck(amount = 0.4, time = 0.12, hold = 0.6) {
    if (!musicGain) return;
    const t = now();
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setValueAtTime(musicGain.gain.value, t);
    musicGain.gain.linearRampToValueAtTime(0.34 * amount, t + time);
    musicGain.gain.linearRampToValueAtTime(0.34, t + time + hold);
  }

  /* ------------------------------------------------------------- tension ramp */
  /* v2. The first version was a filtered-noise sweep, which reads as WIND rather
     than tension. What actually builds is an accelerating roll — the drum-roll /
     roulette-wheel cue — under a fundamental that climbs in musical steps, with a
     tremolo that speeds up. Three styles, cycled from the settings. */

  const RAMP_STYLES = ["sweep", "roll", "riser", "choir"];
  let rampStyle = 0;
  const cycleRamp = () => { rampStyle = (rampStyle + 1) % RAMP_STYLES.length; return RAMP_STYLES[rampStyle]; };
  const rampStyleName = () => RAMP_STYLES[rampStyle];

  let ramp = null, rollTimer = null;

  function rampStart() {
    init();
    rampKill();
    const t = now();
    const style = RAMP_STYLES[rampStyle];

    const out = ctx.createGain();
    out.gain.value = 1;
    out.connect(rampGain);

    // --- fundamental: climbs in semitone steps, not a smooth glide
    const oscA = ctx.createOscillator(), oscB = ctx.createOscillator();
    oscA.type = style === "choir" ? "triangle" : "sawtooth";
    oscB.type = oscA.type;
    oscB.detune.value = style === "choir" ? 7 : 14;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(700, t);
    lp.Q.value = 6;
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(style === "choir" ? 0.030 : 0.018, t + 0.2);

    // --- tremolo that accelerates with the level: the "building" cue
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.type = "sine";
    lfo.frequency.setValueAtTime(4, t);
    lfoG.gain.value = 0.5;
    lfo.connect(lfoG);
    lfoG.connect(og.gain);

    oscA.connect(lp); oscB.connect(lp); lp.connect(og); og.connect(out);
    const base = style === "riser" ? 90 : 62;
    oscA.frequency.setValueAtTime(base, t);
    oscB.frequency.setValueAtTime(base, t);
    oscA.start(t); oscB.start(t); lfo.start(t);

    ramp = { oscA, oscB, lp, og, lfo, out, base, style, level: 0, period: 200 };

    // --- the original: a bandpass noise bed sweeping upward. Restored as the
    //     default because it reads better in play than the roll did.
    if (style === "sweep") {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.Q.value = 3.2;
      bp.frequency.setValueAtTime(240, t);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.linearRampToValueAtTime(0.030, t + 0.18);
      src.connect(bp); bp.connect(ng); ng.connect(out);
      src.start(t);
      ramp.sweepSrc = src; ramp.sweepFilt = bp; ramp.sweepGain = ng;
    }

    // --- the accelerating roll
    if (style === "roll" || style === "riser") {
      const strike = () => {
        if (!ramp) return;
        const L = ramp.level;
        noise(0.028, { freq: 1500 + 2400 * L, gain: 0.016 + 0.022 * L, bus: out });
        if (style === "roll")
          voice(150 + 220 * L, 0.026, { type: "square", gain: 0.010 + 0.016 * L, bus: out });
        rollTimer = setTimeout(strike, ramp.period);
      };
      rollTimer = setTimeout(strike, 160);
    }
  }

  /* level 0..1 */
  function rampTo(level, glide = 0.24) {
    if (!ramp) return;
    const L = Math.max(0, Math.min(1, level));
    const t = now();
    ramp.level = L;

    // fundamental climbs two octaves, quantised to semitones so it stays musical
    const semis = Math.round(L * 24);
    const f = ramp.base * Math.pow(2, semis / 12);
    ramp.oscA.frequency.linearRampToValueAtTime(f, t + glide);
    ramp.oscB.frequency.linearRampToValueAtTime(f, t + glide);
    ramp.lp.frequency.linearRampToValueAtTime(700 + 3400 * L, t + glide);
    ramp.og.gain.linearRampToValueAtTime(
      (ramp.style === "choir" ? 0.030 : 0.018) + 0.036 * L, t + glide);
    // tremolo speeds up 4 -> 26 Hz
    ramp.lfo.frequency.linearRampToValueAtTime(4 + 22 * L, t + glide);
    // roll accelerates between strikes
    ramp.period = Math.max(62, 210 - 148 * L);
    // the sweep bed climbs with the count
    if (ramp.sweepFilt) {
      ramp.sweepFilt.frequency.linearRampToValueAtTime(240 + 5200 * L, t + glide);
      ramp.sweepGain.gain.linearRampToValueAtTime(0.030 + 0.075 * L, t + glide);
    }
  }

  /* Final surge, then cut dead — call immediately before slam(). */
  function rampBurst() {
    if (!ramp) return;
    const t = now();
    const r = ramp;
    ramp = null;
    if (rollTimer) { clearTimeout(rollTimer); rollTimer = null; }

    // a last stutter of strikes, tightening into the impact
    for (let i = 0; i < 7; i++) {
      const d = 0.1 * Math.pow(0.72, i);
      noise(0.03, { at: t + i * d * 1.4, freq: 3000 + i * 500, gain: 0.032, bus: r.out });
    }
    const top = r.base * Math.pow(2, 26 / 12);
    r.oscA.frequency.linearRampToValueAtTime(top, t + 0.16);
    r.oscB.frequency.linearRampToValueAtTime(top, t + 0.16);
    r.lp.frequency.linearRampToValueAtTime(8000, t + 0.16);
    r.og.gain.linearRampToValueAtTime(0.07, t + 0.13);
    r.og.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
    if (r.sweepFilt) {
      r.sweepFilt.frequency.linearRampToValueAtTime(9000, t + 0.14);
      r.sweepGain.gain.linearRampToValueAtTime(0.13, t + 0.11);
      r.sweepGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      setTimeout(() => { try { r.sweepSrc.stop(); } catch (e) {} }, 600);
    }
    setTimeout(() => {
      try { r.oscA.stop(); r.oscB.stop(); r.lfo.stop(); } catch (e) {}
    }, 620);
  }

  function rampKill() {
    if (rollTimer) { clearTimeout(rollTimer); rollTimer = null; }
    if (!ramp) return;
    const r = ramp;
    ramp = null;
    try {
      const t = now();
      r.og.gain.cancelScheduledValues(t);
      r.og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      if (r.sweepGain) r.sweepGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      setTimeout(() => {
        try { r.oscA.stop(); r.oscB.stop(); r.lfo.stop(); } catch (e) {}
        try { if (r.sweepSrc) r.sweepSrc.stop(); } catch (e) {}
      }, 220);
    } catch (e) {}
  }

  /* ------------------------------------------------------------- sfx */
  const S = {
    click:   () => voice(700, 0.05, { gain: 0.1, decay: 0.05 }),
    select:  () => { voice(880, 0.05, { gain: 0.1 }); voice(1320, 0.05, { gain: 0.05, delay: 0.02 }); },
    deselect:() => voice(560, 0.05, { gain: 0.08 }),
    bad:     () => { voice(300, 0.07, { gain: 0.12, type: "sawtooth" });
                     voice(283, 0.11, { gain: 0.12, type: "sawtooth", delay: 0.06 }); },
    deal:    () => { noise(0.06, { freq: 2600, gain: 0.09 });
                     voice(620, 0.05, { gain: 0.05, type: "triangle" }); },
    flip:    () => { noise(0.05, { freq: 3200, gain: 0.1 });
                     voice(900, 0.06, { gain: 0.06, slideTo: 1400, type: "square" }); },
    cut:     () => { voice(400, 0.1, { gain: 0.12, slideTo: 900, type: "square", send: 0.3 });
                     noise(0.09, { freq: 2200, gain: 0.1 }); },
    toCrib:  () => { noise(0.07, { freq: 1600, gain: 0.08 });
                     voice(330, 0.09, { gain: 0.08, slideTo: 220, type: "triangle" }); },
    buy:     () => [523, 659, 784, 1047].forEach((f, i) =>
                     voice(f, 0.16, { gain: 0.09, delay: i * 0.05, send: 0.3, detune: 8 })),
    level:   () => [392, 523, 659, 784, 1047].forEach((f, i) =>
                     voice(f, 0.2, { gain: 0.085, delay: i * 0.045, type: "square", send: 0.35, detune: 10 })),
    milestone: () => { [659, 880, 1319].forEach((f, i) =>
                     voice(f, 0.35, { gain: 0.11, delay: i * 0.06, send: 0.4, detune: 12 }));
                     kick({ gain: 0.4 }); },
    win:     () => { [523, 659, 784, 1047, 1319].forEach((f, i) =>
                     voice(f, 0.42, { gain: 0.1, delay: i * 0.1, send: 0.4, detune: 10 }));
                     kick(); snare({ delay: 0.5 }); },
    lose:    () => [440, 349, 294, 220].forEach((f, i) =>
                     voice(f, 0.5, { gain: 0.1, delay: i * 0.17, type: "triangle", send: 0.3 })),
  };

  /* Sidechain duck — the mixing trick that lets a quiet element win. */
  function duckRamp(amount = 0.35, hold = 0.07) {
    if (!rampGain) return;
    const t = now();
    rampGain.gain.cancelScheduledValues(t);
    rampGain.gain.setValueAtTime(rampGain.gain.value, t);
    rampGain.gain.linearRampToValueAtTime(0.30 * amount, t + 0.012);
    rampGain.gain.linearRampToValueAtTime(0.30, t + 0.012 + hold);
  }

  /* Cascade tick — pitch climbs with the index so the count-up builds a chord. */
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
  /* Four layers, the way a 16-bit point pickup is built:
       transient  — 4ms noise click so it has an edge
       body       — bright square with a fast upward pitch blip
       sparkle    — octave up, very short
       weight     — triangle a fifth below, so it isn't thin       */
  function tick(index, kind) {
    const semi = PENTA[Math.min(index, PENTA.length - 1)];
    const root = { fifteen: 523.25, pair: 587.33, run: 659.25,
                   flush: 698.46, nobs: 784, charm: 880 }[kind] || 523.25;
    const f = root * Math.pow(2, semi / 12);
    duckRamp(0.30, 0.09);

    noise(0.012, { freq: 5200, gain: 0.09 });
    voice(f * 0.72, 0.14, { type: "square", gain: 0.16, detune: 6,
                            slideTo: f, decay: 0.13, send: 0.26 });
    voice(f * 2, 0.06, { type: "square", gain: 0.055, delay: 0.012 });
    voice(f / 1.5, 0.17, { type: "triangle", gain: 0.075, decay: 0.16 });
  }

  /* The multiplier landing — the biggest hit in the game. */
  function slam(magnitude = 1) {
    const m = Math.min(3, magnitude);
    duckRamp(0.0, 0.5);
    kick({ gain: 0.55 });
    noise(0.3, { freq: 300, filter: "lowpass", sweepTo: 60, gain: 0.22 });
    [261.63, 329.63, 392, 523.25].forEach((f, i) =>
      voice(f * (1 + 0.0 * i), 0.55, { gain: 0.09 * m, type: "square", detune: 11,
        delay: i * 0.02, send: 0.45, decay: 0.55 }));
    voice(1046.5, 0.4, { gain: 0.06 * m, type: "square", delay: 0.08, send: 0.5 });
    duck(0.55, 0.06, 0.35);
  }

  return { init, unlock, playMusic, stopMusic, duck, voice, noise, kick, snare, hat,
           tick, cribTick, slam, setProximity, rampStart, rampTo, rampBurst, rampKill,
           cycleRamp, rampStyleName, duckRamp,
           sfx: (k) => S[k] && S[k](), hz, get ctx() { return ctx; } };
})();

  buy: "buy", level: "level", flip: "flip", cut: "cut", deal: "deal",

/* Tooltips. `title` is desktop-only, so named effects need something tappable.
   Attach with tip(node, "Name", "What it does"). */
let _tipEl = null;
function hideTip() { if (_tipEl) { _tipEl.remove(); _tipEl = null; } }
function tip(node, title, body) {
  if (!node) return node;
  node.classList.add("hastip");
  const show = (ev) => {
    ev.stopPropagation();
    hideTip();
    const t = document.createElement("div");
    t.className = "tipbox";
    t.innerHTML = `<div class="tiptitle"></div><div class="tipbody"></div>`;
    t.querySelector(".tiptitle").textContent = title;
    t.querySelector(".tipbody").textContent = body || "";
    document.body.appendChild(t);
    const r = node.getBoundingClientRect();
    const w = Math.min(260, window.innerWidth - 24);
    t.style.width = w + "px";
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(12, Math.min(window.innerWidth - w - 12, left));
    t.style.left = left + "px";
    const above = r.top > 150;
    t.style.top = (above ? r.top - t.offsetHeight - 10 : r.bottom + 10) + "px";
    _tipEl = t;
  };
  node.addEventListener("click", show);
  node.addEventListener("mouseenter", show);
  node.addEventListener("mouseleave", hideTip);
  return node;
}
document.addEventListener("click", hideTip);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};

let AC = null;
const ac = () => (AC ||= new (window.AudioContext || window.webkitAudioContext)());
function tone(freq, dur = 0.08, type = "square", gain = 0.06, delay = 0) {
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur + 0.02);
  } catch (e) {}
}

  PREP: () => [392, 494, 587].forEach((f, i) => tone(f, 0.12, "square", 0.05, i * 0.05)),
  STRIKE: () => { tone(1200, 0.1, "square", 0.07); tone(300, 0.16, "sawtooth", 0.06, 0.06); },
  RALLY: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.13, "square", 0.055, i * 0.055)),
  "GRAND MELD": () => [523, 659, 784, 1047, 1319, 1568]
    .forEach((f, i) => tone(f, 0.2, "square", 0.06, i * 0.05)),
  hit: () => tone(160, 0.14, "sawtooth", 0.07),

  n.style.height = 98 * scale + "px";

    const gi = SPLIT_RANKS.indexOf(CRANK_LABEL[rank]);

    const gw = big ? 22 : 11, gh = big ? 14 : 7;
    const g = el("div", "sg");

    g.style.height = gh * scale + "px";

    g.style.backgroundSize = `${gw * 13 * scale}px ${gh * 2 * scale}px`;
    g.style.backgroundPosition = `${-gi * gw * scale}px ${-red * gh * scale}px`;
    n.appendChild(g);
    if (!big) {
      const p = el("div", "sg");
      const si = SPLIT_SUITS.indexOf(suit);
      p.style.width = 7 * scale + "px";
      p.style.height = 7 * scale + "px";
      p.style.left = (x + 2) * scale + "px";
      p.style.top = (y + 8) * scale + "px";
      if (ART.split) p.style.backgroundImage = `url(${ART.split.pips})`;
      p.style.backgroundSize = `${7 * 4 * scale}px ${7 * 2 * scale}px`;
      p.style.backgroundPosition = `${-si * 7 * scale}px ${-red * 7 * scale}px`;
      n.appendChild(p);
    }
  };
  put(card.rank, card.suit, 5, 7, false);
  put(card.rank2, card.suit2 || card.suit, 70 - 16, 98 - 22, false);
  put(card.rank, card.suit, 6, 34, true);
  put(card.rank2, card.suit2 || card.suit, 70 - 28, 52, true);
  n.title = `${CRANK_LABEL[card.rank]} or ${CRANK_LABEL[card.rank2]} — counts as whichever scores better`;
  return n;
}

function cardEl(card, scale = 2) {
  if (card && card.rank2 !== undefined) return splitCardEl(card, scale);
  const n = el("div", "card");
  if (card && card.enh) {
    n.classList.add("enh", "enh-" + card.enh);
    const meta = (typeof ENHANCEMENTS !== "undefined") && ENHANCEMENTS[card.enh];
    if (ART.marks && ART.marks[card.enh]) {
      const ov = el("div", "markov");
      ov.style.backgroundImage = `url(${ART.marks[card.enh]})`;
      n.appendChild(ov);
    }
    n.title = meta ? `${meta.name} — ${meta.text}` : "";
  }
  const col = card.rank - 1;
  const row = SUITS.indexOf(card.suit);
  const w = 70 * scale, h = 98 * scale;
  n.style.width = w + "px";
  n.style.height = h + "px";
  n.style.backgroundImage = `url(${ART.atlas})`;
  n.style.backgroundSize = `${13 * w}px ${4 * h}px`;
  n.style.backgroundPosition = `-${col * w}px -${row * h}px`;
  return n;
}

function backEl(scale = 2) {
  const n = el("div", "card");
  n.style.width = 70 * scale + "px";
  n.style.height = 98 * scale + "px";
  const skin = (typeof Achv !== "undefined") ? Achv.activeBack() : "indigo";
  const src = (ART.backs && ART.backs[skin]) || ART.back;
  n.style.backgroundImage = `url(${src})`;
  n.style.backgroundSize = "100% 100%";
  return n;
}

function creatureEl(id, anim = "idle", scale = 3) {
  const s = SPRITES[id][anim];
  const n = el("div", "creature");
  n.dataset.id = id;
  const size = s.h * scale;
  n.style.width = size + "px";
  n.style.height = size + "px";
  n.style.backgroundImage = `url(${s.url})`;
  n.style.backgroundSize = `${s.frames * size}px ${size}px`;
  n.style.setProperty("--frames", s.frames);
  n.style.setProperty("--span", `-${s.frames * size}px`);
  n.style.animation = `sprite ${anim === "idle" ? 0.9 : 0.4}s steps(${s.frames}) ${anim === "idle" ? "infinite" : "1"}`;
  return n;
}

function playAnim(node, id, anim, scale = 3) {
  const s = SPRITES[id][anim];
  const size = s.h * scale;
  node.style.backgroundImage = `url(${s.url})`;
  node.style.backgroundSize = `${s.frames * size}px ${size}px`;
  node.style.setProperty("--span", `-${s.frames * size}px`);
  node.style.animation = "none";
  void node.offsetWidth;
  node.style.animation = `sprite 0.42s steps(${s.frames}) 1`;
  if (anim !== "idle") {
    setTimeout(() => {
      const idle = SPRITES[id].idle;
      const isz = idle.h * scale;
      node.style.backgroundImage = `url(${idle.url})`;
      node.style.backgroundSize = `${idle.frames * isz}px ${isz}px`;
      node.style.setProperty("--span", `-${idle.frames * isz}px`);
      node.style.animation = `sprite 0.9s steps(${idle.frames}) infinite`;
    }, 440);
  }
}

// ---------------------------------------------------------------- app state
const App = {
  run: null, combat: null, node: 0, mode: "gauntlet",
  selected: [], busy: false, sandbox: false, meldling: "pip",
};
const root = () => $("#app");

function screen(name) {
  root().innerHTML = "";
  root().dataset.screen = name;
}

// ---------------------------------------------------------------- title
function showTitle() {
  screen("title");
  const c = el("div", "col center");
  c.append(el("h1", "title", "MELDLINGS"));
  c.append(el("p", "dim", "Count it. Cut it. Break it."));

  const parade = el("div", "row center gap");
  for (const id of Object.keys(ROSTER).filter((k) => ROSTER[k].kind === "meldling"))
    parade.append(creatureEl(id, "idle", 2));
  c.append(parade);

  c.append(btn("PLAY", () => { sfx("RALLY"); showCribSelect(); }, "big"));
  c.append(el("p", "dim small",
    "A cribbage roguelite. Charms, Marks, and Spoilers on the road."));
  root().append(c);
}

function showSelect() {
  screen("select");
  const c = el("div", "col");
  c.append(el("h2", "title", "CHOOSE YOUR MELDLING"));
  const row = el("div", "row center gap wrap");
  const info = el("div", "panel col");
  const nameL = el("h3", "gold", "");
  const blurb = el("p", "dim", "");
  info.append(nameL, blurb);

  const ids = Object.keys(ROSTER).filter((k) => ROSTER[k].kind === "meldling");
  const pick = (id) => {
    App.meldling = id;
    sfx("select");
    [...row.children].forEach((n) => n.classList.toggle("chosen", n.dataset.id === id));
    nameL.textContent = `${ROSTER[id].name} — ${ROSTER[id].hp} HP`;
    blurb.textContent = ROSTER[id].blurb;
  };
  for (const id of ids) {
    const slot = el("div", "slot");
    slot.dataset.id = id;
    slot.append(creatureEl(id, "idle", 3));
    slot.onclick = () => pick(id);
    row.append(slot);
  }
  c.append(row, info);

    App.run = new Run(App.meldling);

    else if (App.mode === "gin") startGin("deadwood");

// ---------------------------------------------------------------- gauntlet track
function showTrack() {
  screen("track");
  const c = el("div", "col");
  c.append(el("h2", "title", "THE GAUNTLET"));
  c.append(el("p", "dim",
    `${ROSTER[App.run.meldling].name} — ${App.run.hp}/${App.run.maxHp} HP` +
    (App.run.relics.length ? ` · ${App.run.relics.map((r) => r.name).join(", ")}` : "")));

  const track = el("div", "track");
  GAUNTLET.forEach((n, i) => {
    const node = el("div", "tnode " + (i < App.node ? "done" : i === App.node ? "now" : ""));
    node.textContent = { battle: "⚔", cache: "◆", rest: "✚", elite: "☠", boss: "♛" }[n.type];
    node.title = n.enemy ? ROSTER[n.enemy].name : n.type;
    track.append(node);
  });
  c.append(track);

  const entry = GAUNTLET[App.node];
  const label = { battle: "Battle", cache: "Cache", rest: "Rest", elite: "Elite", boss: "BOSS" }[entry.type];
  c.append(el("p", "gold", `Next: ${label}${entry.enemy ? " — " + ROSTER[entry.enemy].name : ""}`));

    else startBattle(entry.enemy);

}

// ---------------------------------------------------------------- battle
function startBattle(enemyId, sandbox = false) {
  App.sandbox = sandbox;
  App.combat = new Combat(App.run, enemyId);
  App.selected = [];
  App.busy = false;
  renderBattle();
}

function renderBattle() {
  const C = App.combat;
  screen("battle");
  const c = el("div", "col tight");

  // enemy
  const ep = el("div", "panel col tight");
  ep.append(rowLR(C.enemy.name, `${C.enemy.hp} / ${C.enemy.maxHp}`, "red"));
  ep.append(bar(C.enemy.hp / C.enemy.maxHp, "red"));
  ep.append(el("p", "small blue", C.enemy.statusLine()));
  ep.append(el("p", "small gold", C.intentText()));
  c.append(ep);

  // arena
  const arena = el("div", "row center gap arena");
  const hero = creatureEl(C.player.id, "idle", 3);
  hero.id = "hero";
  const foe = creatureEl(C.enemy.id, "idle", 3);
  foe.id = "foe";
  foe.style.transform = "scaleX(-1)";
  arena.append(hero, el("div", "verdict", ""), foe);
  c.append(arena);

  // player
  const pp = el("div", "panel col tight");
  pp.append(rowLR(ROSTER[C.player.id].name,
    `${C.player.hp} / ${C.player.maxHp}`, "green"));
  pp.append(bar(C.player.hp / C.player.maxHp, "green"));
  pp.append(el("p", "small blue", C.player.statusLine()));
  pp.append(el("p", "small gold",
    `FOCUS ${C.focus}/${C.maxFocus} · TURN ${C.turn} · DECK ${C.deck.length}`));
  c.append(pp);

  c.append(el("p", "banner", "Tap cards to build a meld"));

  // hand
  const hand = el("div", "hand");
  C.hand.forEach((card, i) => {
    const n = cardEl(card, 2);
    n.dataset.i = i;
    if (App.selected.includes(i)) n.classList.add("sel");
    else if (App.selected.length &&
      !canJoin(App.selected.map((j) => C.hand[j]), card)) n.classList.add("dim");
    n.onclick = () => toggleCard(i);
    hand.append(n);
  });
  c.append(hand);

  // buttons
  const b1 = el("div", "row gap");
  b1.append(btn("Sort", () => { C.hand.sort((a, b) => a.rank - b.rank || SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit)); App.selected = []; sfx("click"); renderBattle(); }, "small"));
  b1.append(btn("Suit", () => { C.hand.sort((a, b) => SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit) || a.rank - b.rank); App.selected = []; sfx("click"); renderBattle(); }, "small"));
  b1.append(btn("Hint", doHint, "small"));
  c.append(b1);

  const b2 = el("div", "row gap");
  const playB = btn("PLAY MELD", doPlay);
  playB.id = "playBtn";
  b2.append(playB, btn("Cycle", doCycle, "small"), btn("End Turn", doEndTurn, "small"));
  c.append(b2);

  if (App.sandbox) c.append(sandboxDrawer());
  root().append(c);
  updateVerdict();
}

function rowLR(l, r, cls) {
  const n = el("div", "row between");
  n.append(el("span", "", l), el("span", cls || "", r));
  return n;
}
function bar(frac, cls) {
  const outer = el("div", "bar");
  const inner = el("div", "fill " + cls);
  inner.style.width = Math.max(0, Math.min(100, frac * 100)) + "%";
  outer.append(inner);
  return outer;
}

function toggleCard(i) {
  const C = App.combat;
  if (App.busy) return;
  const at = App.selected.indexOf(i);
  if (at >= 0) { App.selected.splice(at, 1); sfx("deselect"); }
  else {
    const sel = App.selected.map((j) => C.hand[j]);
    if (sel.length && !canJoin(sel, C.hand[i])) {
      sfx("bad");
      const n = $(`.hand [data-i="${i}"]`);
      if (n) { n.classList.add("shake"); setTimeout(() => n.classList.remove("shake"), 300); }
      return;
    }
    App.selected.push(i);
    sfx("select");
  }
  refreshHandClasses();
  updateVerdict();
}

function refreshHandClasses() {
  const C = App.combat;
  const sel = App.selected.map((j) => C.hand[j]);
  document.querySelectorAll(".hand .card").forEach((n) => {
    const i = +n.dataset.i;
    n.classList.toggle("sel", App.selected.includes(i));
    n.classList.toggle("dim", !!sel.length && !App.selected.includes(i) && !canJoin(sel, C.hand[i]));
  });
}

function updateVerdict() {
  const C = App.combat;
  const sel = App.selected.map((i) => C.hand[i]);
  const v = classify(sel);
  const banner = $(".banner"), verdict = $(".verdict"), playB = $("#playBtn");
  if (!sel.length) {
    banner.textContent = "Tap cards to build a meld";
    verdict.textContent = "";
  } else if (v.valid) {
    banner.textContent = C.preview(sel);
    verdict.textContent = v.action;
  } else {
    banner.textContent = `${sel.length} selected · ${v.label}`;
    verdict.textContent = "—";
  }
  if (playB) playB.disabled = !v.valid || C.focus <= 0 || App.busy;
}

function doHint() {
  const C = App.combat;
  const ms = findMelds(C.hand);
  if (!ms.length) { sfx("bad"); $(".banner").textContent = "No meld — Cycle to draw."; return; }
  App.selected = ms[0].slice();
  sfx("PREP");
  refreshHandClasses();
  updateVerdict();
}

function doPlay() {
  const C = App.combat;
  const sel = App.selected.map((i) => C.hand[i]);
  const v = classify(sel);
  if (!v.valid || C.focus <= 0 || App.busy) return;
  App.busy = true;
  const cards = C.takeFromHand(App.selected);
  const out = C.playMeld(cards);
  App.selected = [];
  sfx(out.action);
  const hero = $("#hero"), foe = $("#foe");
  if (hero) playAnim(hero, C.player.id, "attack");
  if (out.offensive && foe) setTimeout(() => { playAnim(foe, C.enemy.id, "hurt"); sfx("hit"); }, 220);
  setTimeout(() => {
    App.busy = false;
    if (C.over) return endBattle();
    renderBattle();
    $(".banner").textContent = out.text;
  }, 620);
}

function doCycle() {
  const C = App.combat;
  if (App.busy || C.focus <= 0) return;
  if (App.selected.length !== 1) { sfx("bad"); $(".banner").textContent = "Select one card to cycle."; return; }
  C.discardCard(App.selected[0]);
  C.cycle();
  App.selected = [];
  sfx("place");
  renderBattle();
}

function doEndTurn() {
  const C = App.combat;
  if (App.busy) return;
  App.busy = true;
  App.selected = [];
  const ev = C.endTurn();
  const foe = $("#foe"), hero = $("#hero");
  let msg = "";
  for (const e of ev) {
    if (e.t === "hit") { if (foe) playAnim(foe, C.enemy.id, "attack"); setTimeout(() => hero && playAnim(hero, C.player.id, "hurt"), 200); sfx("hit"); msg = `${C.enemy.name} hits you for ${e.n}.`; }
    else if (e.t === "block") msg = `${C.enemy.name} braces for ${e.n}.`;
    else if (e.t === "burn") msg = `Burn deals ${e.n}.`;
    else if (e.t === "hex") msg = `You are Hexed (${e.n}).`;
  }
  setTimeout(() => {
    App.busy = false;
    if (C.over) return endBattle();
    renderBattle();
    $(".banner").textContent = msg || "Your turn — Focus restored.";
  }, 700);
}

function endBattle() {
  const C = App.combat;
  App.run.hp = C.player.hp;
  sfx(C.victory ? "win" : "lose");
  if (App.sandbox) { setTimeout(() => startBattle(C.enemy.id, true), 900); return; }
  setTimeout(() => {
    if (!C.victory) { App.run.lastResult = "defeat"; return showEnd(); }
    App.run.essence += GAUNTLET[App.node].type === "boss" ? 40 : 15;
    App.run.heal(App.run.relicValue("heal_after"));
    App.node++;
    if (App.node >= GAUNTLET.length) { App.run.lastResult = "victory"; return showEnd(); }
    showReward(false);
  }, 900);
}

// ---------------------------------------------------------------- reward / rest / end
function showReward(isCache) {
  screen("reward");
  const c = el("div", "col");
  c.append(el("h2", "title", isCache ? "CACHE FOUND" : "VICTORY"));
  c.append(el("p", "dim", `${App.run.hp}/${App.run.maxHp} HP · ${App.run.essence} Essence`));
  const offers = App.run.offerRelics(3);
  if (!offers.length) c.append(el("p", "dim", "Nothing left to find."));
  for (const r of offers) {
    const b = el("button", "relic");
    b.append(el("div", "gold", r.name), el("div", "small dim", r.text));
    b.onclick = () => { App.run.relics.push(r); sfx("RALLY"); if (isCache) App.node++; showTrack(); };
    c.append(b);
  }
  c.append(btn("Skip", () => { if (isCache) App.node++; showTrack(); }, "small"));
  root().append(c);
}

function showRest() {
  screen("rest");
  const c = el("div", "col center");
  c.append(el("h2", "title", "A QUIET SHUFFLE"));
  c.append(creatureEl(App.run.meldling, "idle", 4));
  c.append(el("p", "dim", `${App.run.hp}/${App.run.maxHp} HP`));
  const heal = Math.max(8, Math.round(App.run.maxHp * 0.32));
  c.append(btn(`Rest — heal ${heal}`, () => { App.run.heal(heal); sfx("win"); App.node++; showTrack(); }, "big"));
  c.append(btn("Train — +6 max HP", () => { App.run.maxHp += 6; App.run.heal(6); sfx("GRAND MELD"); App.node++; showTrack(); }));
  root().append(c);
}

function showEnd() {
  screen("end");
  const win = App.run.lastResult === "victory";
  const c = el("div", "col center");
  c.append(el("h2", "title", win ? "GAUNTLET CLEARED" : "RUN ENDED"));
  c.append(creatureEl(win ? App.run.meldling : "kingpin", "idle", 4));
  c.append(el("p", "dim",
    `Reached node ${App.node + 1}/${GAUNTLET.length} · ${App.run.relics.length} relics · ${App.run.essence} Essence`));
  c.append(btn("Play Again", showTitle, "big"));
  root().append(c);
}

// ---------------------------------------------------------------- sandbox
function sandboxDrawer() {
  const C = App.combat;
  const d = el("details", "drawer");
  d.open = false;
  d.append(el("summary", "", "⚙ TRAINING"));
  const body = el("div", "col tight");

  const give = (cards) => { for (const [r, s] of cards) C.hand.push({ rank: r, suit: s }); sfx("draw"); renderBattle(); };
  const g1 = el("div", "row gap wrap");
  [["Pair", [[7, "H"], [7, "S"]]],
   ["2-Run", [[5, "D"], [6, "D"]]],
   ["3-Run", [[4, "H"], [5, "H"], [6, "H"]]],
   ["5-Run", [[3, "C"], [4, "C"], [5, "C"], [6, "C"], [7, "C"]]],
   ["3-Set", [[9, "H"], [9, "S"], [9, "C"]]],
   ["GRAND", [[12, "S"], [12, "H"], [12, "C"], [12, "D"]]]]
    .forEach(([label, cards]) => g1.append(btn(label, () => give(cards), "small")));
  body.append(el("p", "gold small", "Deal me a meld"), g1);

  const g2 = el("div", "row gap wrap");
  g2.append(btn("+3 Focus", () => { C.focus += 3; renderBattle(); }, "small"));
  g2.append(btn("Draw 3", () => { C.drawToHand(3); renderBattle(); }, "small"));
  g2.append(btn("Foe 1hp", () => { C.enemy.hp = 1; renderBattle(); }, "small"));
  g2.append(btn("Foe full", () => { C.enemy.hp = C.enemy.maxHp; renderBattle(); }, "small"));
  g2.append(btn("+20 HP", () => { C.player.hp = Math.min(C.player.maxHp, C.player.hp + 20); renderBattle(); }, "small"));
  body.append(el("p", "gold small", "Resources"), g2);

  const g3 = el("div", "row gap wrap");
  for (const id of Object.keys(ROSTER).filter((k) => ROSTER[k].kind !== "meldling"))
    g3.append(btn(ROSTER[id].name, () => startBattle(id, true), "small"));
  body.append(el("p", "gold small", "Opponent"), g3);

  const g4 = el("div", "row gap wrap");
  for (const r of RELICS)
    g4.append(btn(r.name, () => { if (!App.run.hasRelic(r.id)) App.run.relics.push(r); sfx("RALLY"); renderBattle(); }, "small"));
  body.append(el("p", "gold small", "Relics"), g4);

  const g5 = el("div", "row gap wrap");
  for (const [k, lo, hi] of [["handSize", 6, 16], ["focus", 1, 5]]) {
    const wrap = el("label", "small dim", `${k} `);
    const inp = el("input");
    inp.type = "number"; inp.value = TUNING[k]; inp.min = lo; inp.max = hi;
    inp.onchange = () => { TUNING[k] = +inp.value; };
    wrap.append(inp);
    g5.append(wrap);
  }
  const wrap2 = el("label", "small dim", "enemyDmg ");
  const inp2 = el("input");
  inp2.type = "number"; inp2.step = "0.05"; inp2.value = TUNING.enemyDmg;
  inp2.onchange = () => { TUNING.enemyDmg = +inp2.value; };
  wrap2.append(inp2);
  g5.append(wrap2);
  body.append(el("p", "gold small", "Live tuning (applies next battle)"), g5);

  body.append(btn("Leave Training", showTitle, "small"));
  d.append(body);
  return d;
}
