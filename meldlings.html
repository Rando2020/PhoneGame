function showTutorial() {
  Tut.active = true;
  Tut.step = 0;
  renderTutStep();
}

function renderTutStep() {
  const st = TUT_STEPS[Tut.step];
  if (!st) {
    Tut.active = false;
    try {
      const m = Achv.load(); m.tutorial = 1; Achv.save(m);
    } catch (e) {}
    return showCribSelect();
  }
  screen("tutorial");
  const c = el("div", "col center tutwrap");

  const pips = el("div", "row gap tutpips");
  TUT_STEPS.forEach((_, i) => {
    const d = el("div", "tutpip" + (i === Tut.step ? " on" : i < Tut.step ? " past" : ""));
    pips.append(d);
  });
  c.append(pips);

  const cre = creatureEl(st.art, "idle", 4);
  cre.classList.add("tutcre");
  c.append(cre);

  const box = el("div", "panel col tight tutbox");
  box.append(el("div", "tuttitle", st.title));
  box.append(el("div", "tutbody", st.body));
  c.append(box);

  c.append(tutVisual(st.anchor));

  const row = el("div", "row gap");
  if (Tut.step > 0)
    row.append(btn("Back", () => { Tut.step--; sfx16("click"); renderTutStep(); }, "small"));
  row.append(btn(Tut.step === TUT_STEPS.length - 1 ? "PLAY" : "Next", () => {
    Tut.step++;
    sfx16(Tut.step >= TUT_STEPS.length ? "buy" : "select");
    renderTutStep();
  }, "big"));
  c.append(row);
  c.append(btn("Skip", () => { Tut.step = TUT_STEPS.length; renderTutStep(); }, "small"));
  root().append(c);
}

/* A tiny live illustration per beat — real cards, not screenshots. */
function tutVisual(anchor) {
  const wrap = el("div", "row center gap tutvis");
  const C = (r, s, enh) => { const o = { rank: r, suit: s }; if (enh) o.enh = enh; return o; };
  if (anchor === "hand") {
    [C(5, "H"), C(5, "S"), C(10, "C"), C(11, "D"), C(2, "S"), C(9, "H")]
      .forEach((cd, i) => {
        const n = cardEl(cd, 0.95);
        if (i < 4) n.classList.add("sel"); else n.classList.add("tocrib");
        wrap.append(n);
      });
  } else if (anchor === "cut") {
    [C(5, "H"), C(5, "S"), C(10, "C"), C(11, "D")].forEach((cd) => wrap.append(cardEl(cd, 0.95)));
    const back = backEl(0.95); back.classList.add("cutwait");
    wrap.append(back);
  } else if (anchor === "crib") {
    [C(2, "S"), C(9, "H")].forEach((cd) => wrap.append(cardEl(cd, 0.95)));
    wrap.append(el("div", "small gold", "→ your Crib"));
  } else if (anchor === "count") {
    const t = el("div", "col tight");
    [["Fifteen 2", "+2"], ["Fifteen 4", "+2"], ["Pair of 5s", "+2"], ["Run of 3", "+3"]]
      .forEach(([a, b]) => {
        const r = el("div", "row between casrow");
        r.append(el("span", "grow", a), el("span", "casval", b));
        t.append(r);
      });
    wrap.append(t);
  } else if (anchor === "shop") {
    [C(5, "H", "gilded"), C(7, "C", "glass"), C(12, "S", "coin")]
      .forEach((cd) => wrap.append(cardEl(cd, 0.95)));
  } else if (anchor === "boss") {
    for (const b of ["deadwood", "shuffler", "jokester"]) wrap.append(creatureEl(b, "idle", 2));
  }
  return wrap;
}


/* ============================================================
   THE GUIDED FIRST ROUND
   The six-beat tutorial explains; this one teaches by playing. It runs a real
   round with a stacked deck and coaches at each decision point, then hands the
   game over. Shown once, skippable, replayable from the title.
   ============================================================ */

const Guide = { on: false, beat: 0 };

const GUIDE_BEATS = [
  { at: "deal",
    title: "Six cards.",
    body: "Keep four. Tap them. The two you leave behind are thrown to your Crib, " +
          "which scores for you at the end of the round.",
    look: ".cribhand" },
  { at: "kept",
    title: "Now look at the two numbers.",
    body: "LOCKED IN is what your four cards are worth on their own. EXPECTED AFTER " +
          "CUT is what they're likely worth once a fifth card is turned. They often " +
          "disagree — that disagreement is the whole game.",
    look: ".panel" },
  { at: "cut",
    title: "The cut decides.",
    body: "Only now is a fifth card turned, and it joins your four. A longer roll " +
          "means a better card. You are betting on what's still in the deck.",
    look: ".cutholder" },
  { at: "counted",
    title: "Fifteen two, fifteen four.",
    body: "Every pair of cards adding to fifteen scores 2. Pairs score 2. Runs score " +
          "their length. Then your charms multiply the total.",
    look: ".caslist" },
  { at: "target",
    title: "NEED tells you the truth.",
    body: "The bar shows the target. NEED is how far you are, and the number beside " +
          "it is what each remaining deal must average. When that gets implausible, " +
          "it turns red.",
    look: ".hud" },
  { at: "done",
    title: "That's the loop.",
    body: "Clear the target before your deals run out. Spend Glim between rounds on " +
          "charms and cards. Every fifth round is a Spoiler that breaks a rule. " +
          "Everything else you'll pick up as you go.",
    look: null },
];

function guideStart() {
  Guide.on = true;
  Guide.beat = 0;
  Cb.street = STREETS[0];
  Cb.run = new CribRun("thump", STREETS[0]);
  Cb.round = new CribRound(Cb.run);
  Cb.round.newDeal();
  Cb.keep = [];
  Cb.dealAnim = true;
  renderCrib();
  guideShow("deal");
}

function guideFinish() {
  Guide.on = false;
  try { const m = Achv.load(); m.guided = 1; Achv.save(m); } catch (e) {}
}

/* Show the beat matching this moment, if it hasn't been shown yet. */
function guideShow(at) {
  if (!Guide.on) return;
  const i = GUIDE_BEATS.findIndex((b) => b.at === at);
  if (i < 0 || i < Guide.beat) return;
  Guide.beat = i + 1;
  const b = GUIDE_BEATS[i];

  const old = document.querySelector(".guidebox");
  if (old) old.remove();
  const box = el("div", "guidebox");
  box.append(el("div", "guidekicker", `${i + 1} of ${GUIDE_BEATS.length}`));
  box.append(el("div", "guidetitle", b.title));
  box.append(el("div", "guidebody", b.body));

  const row = el("div", "row gap");
  row.append(btn(i === GUIDE_BEATS.length - 1 ? "PLAY ON" : "Got it", () => {
    box.remove();
    sfx16("select");
    if (i === GUIDE_BEATS.length - 1) { guideFinish(); showCribSelect(); }
  }, "small"));
  row.append(btn("Skip coaching", () => {
    box.remove(); guideFinish(); sfx16("click"); flash("Coaching off.");
  }, "small"));
  box.append(row);
  document.body.append(box);

  if (b.look) {
    document.querySelectorAll(".guidelook").forEach((n) => n.classList.remove("guidelook"));
    const t = document.querySelector(b.look);
    if (t) t.classList.add("guidelook");
  }
  Audio16.voice(660, 0.1, { type: "square", gain: 0.06, send: 0.3 });
}

/* The Gallery — every asset in the game, in one place.
   Doubles as a collection screen and as the fastest way to spot a missing or
   broken asset without hunting through a run. */

const GAL = { tab: "cards" };
const GAL_TABS = [
  ["cards",   "Cards"],
  ["split",   "Split"],
  ["marks",   "Marks"],
  ["backs",   "Backs"],
  ["meld",    "Meldlings"],
  ["spoil",   "Spoilers"],
];

function showGallery() {
  Audio16.playMusic("menu");
  screen("gallery");
  const c = el("div", "col");
  c.append(el("h2", "title", "THE GALLERY"));

  const tabs = el("div", "row gap wrap galtabs");
  for (const [id, label] of GAL_TABS) {
    const b = el("button", "galtab" + (GAL.tab === id ? " on" : ""), label);
    b.onclick = () => { GAL.tab = id; sfx16("click"); showGallery(); };
    tabs.append(b);
  }
  c.append(tabs);

  const body = el("div", "col tight");
  ({ cards: galCards, split: galSplit, marks: galMarks,
     backs: galBacks, meld: galMeld, spoil: galSpoil }[GAL.tab] || galCards)(body);
  c.append(body);

  c.append(btn("Back", showCribSelect, "small"));
  root().append(c);
}

function galNote(box, txt) { box.append(el("p", "small dim galnote", txt)); }

function galCards(box) {
  galNote(box, "All 52 faces. Every card in the game is generated, not drawn by hand.");
  for (const suit of ["S", "H", "C", "D"]) {
    box.append(el("p", "small gold", `${SUIT_SYM[suit]}  ${
      { S: "Spades", H: "Hearts", C: "Clubs", D: "Diamonds" }[suit]}`));
    const row = el("div", "galgrid");
    for (let r = 1; r <= 13; r++) {
      const w = el("div", "galcell");
      w.append(cardEl({ rank: r, suit }, 0.62));
      row.append(w);
    }
    box.append(row);
  }
}

function galSplit(box) {
  galNote(box, "Split cards count as either rank. Four shared images compose all " +
    "2,704 combinations — nothing here is a pre-rendered asset.");
  const samples = [
    [2, 3, "H", "H"], [1, 13, "S", "D"], [10, 11, "C", "C"], [5, 9, "D", "S"],
    [7, 8, "H", "S"], [4, 12, "C", "H"], [6, 6, "D", "D"], [3, 10, "S", "C"],
  ];
  const row = el("div", "galgrid");
  for (const [a, b, s1, s2] of samples) {
    const w = el("div", "galcell");
    w.append(cardEl({ rank: a, rank2: b, suit: s1, suit2: s2 }, 0.72));
    w.append(el("div", "tiny dim", `${CRANK_LABEL[a]}/${CRANK_LABEL[b]}`));
    row.append(w);
  }
  box.append(row);

  const roll = btn("Roll eight more", () => {
    sfx16("cut");
    showGallery();
  }, "small");
  box.append(roll);

  box.append(el("p", "small gold", "How it scores"));
  const demo = el("div", "panel col tight");
  demo.append(el("div", "small",
    "A hand of [2/3] 4 5 10 with a 6 cut scores 8 — the split takes the 3 to " +
    "complete a run of four. Held as a 2 it would score 7."));
  box.append(demo);
}

function galMarks(box) {
  galNote(box, "Marks sit on individual cards and change what they do.");
  for (const k of Object.keys(ENHANCEMENTS)) {
    const m = ENHANCEMENTS[k];
    const row = el("div", "row gap galrow");
    row.append(cardEl({ rank: 5, suit: "H", enh: k }, 0.6));
    const t = el("div", "col tight grow");
    t.append(el("div", "gold", m.name));
    t.append(el("div", "small dim", m.text));
    row.append(t);
    box.append(row);
  }
}

function galBacks(box) {
  galNote(box, "Card backs, bought from the Peddler with Pegs. Tap an owned back to equip it.");
  const row = el("div", "galgrid");
  for (const b of CARD_BACKS) {
    const owned = Achv.ownsBack(b.id);
    const w = el("div", "galcell" + (Achv.activeBack() === b.id ? " on" : ""));
    const img = el("div", "galback");
    if (ART.backs && ART.backs[b.id]) img.style.backgroundImage = `url(${ART.backs[b.id]})`;
    if (!owned) img.classList.add("locked");
    w.append(img);
    w.append(el("div", "tiny " + (owned ? "gold" : "dim"), owned ? b.name : `${b.cost} Pegs`));
    if (owned) w.onclick = () => { Achv.setBack(b.id); sfx16("select"); showGallery(); };
    row.append(w);
  }
  box.append(row);
}

function galMeld(box) {
  galNote(box, "Six Meldlings. Two are earned.");
  for (const id of Object.keys(CRIB_DECKS)) {
    const d = CRIB_DECKS[id];
    const open = Achv.meldlingUnlocked(id);
    const row = el("div", "row gap galrow" + (open ? "" : " dimmed"));
    row.append(creatureEl(id, "idle", 2));
    const t = el("div", "col tight grow");
    t.append(el("div", open ? "gold" : "dim", open ? `${d.name} ${SUIT_SYM[d.suit]}` : "???"));
    t.append(el("div", "small dim", open ? d.text : "Locked."));
    row.append(t);
    box.append(row);
  }
}

function galSpoil(box) {
  galNote(box, `All ${BOSS_POOL.length} Spoilers. Five are drawn per run, so no two runs meet the same set.`);
  for (const sev of [1, 2, 3]) {
    box.append(el("p", `small sev${sev}`,
      ["", "THREAT", "SEVERE", "RUINOUS"][sev]));
    for (const b of BOSS_POOL.filter((x) => x.sev === sev)) {
      const row = el("div", "row gap galrow");
      const cre = creatureEl(b.art, "idle", 1.6);
      cre.style.filter = `hue-rotate(${(b.id.charCodeAt(0) * 37) % 360}deg) saturate(${1 + sev * 0.35})`;
      row.append(cre);
      const t = el("div", "col tight grow");
      t.append(el("div", `sev${sev}`, b.name + (b.align ? `  ${SUIT_SYM[b.align]}` : "")));
      t.append(el("div", "small dim", b.text));
      row.append(t);
      box.append(row);
    }
  }
}

/* ============================================================
   DEV PANEL — testing only.
   To remove entirely: set DEV = false below, or delete this file
   and the one `admin.js` line in tools/build_web.py.
   ============================================================ */
const DEV = true;

function showAdmin() {
  if (!DEV) return showTitle();
  screen("admin");
  const c = el("div", "col");
  c.append(el("h2", "title red", "DEV PANEL"));
  c.append(el("p", "small dim", "Testing shortcuts. Not part of the game."));

  const sect = (t) => c.append(el("p", "small gold", t));
  const act = (label, fn, note) => {
    const b = el("button", "btn small devbtn");
    b.append(el("div", "", label));
    if (note) b.append(el("div", "tiny dim", note));
    b.onclick = () => { fn(); sfx16("buy"); showAdmin(); };
    c.append(b);
  };

  // ---- currency
  sect("CURRENCY");
  c.append(el("p", "small",
    `Glim in run: ${Cb.run ? Cb.run.essence : "—"}   ·   Pegs: ${Achv.pegs()}`));
  act("+100 Glim", () => { if (Cb.run) Cb.run.essence += 100; }, "needs an active run");
  act("+1000 Glim", () => { if (Cb.run) Cb.run.essence += 1000; });
  act("+500 Pegs", () => Achv.addPegs(500));

  // ---- unlocks
  sect("UNLOCKS");
  c.append(el("p", "small",
    `Systems ${SYSTEMS.length - Achv.lockedSystems().length}/${SYSTEMS.length}   ·   ` +
    `Deeds ${Achv.count()}/${ACHIEVEMENTS.length}   ·   Street ${Achv.streetUnlocked()}/${STREETS.length}`));
  act("Unlock all systems", () => SYSTEMS.forEach((s) => Achv.grantSystem(s.id)),
      "crib cut, the play, split cards, sixth slot…");
  act("Unlock all deeds", () => ACHIEVEMENTS.forEach((a) => Achv.grant(a.id)));
  act("Unlock all Streets", () => Achv.unlockStreet(STREETS.length));
  act("Unlock all Meldlings", () => {
    ACHIEVEMENTS.forEach((a) => Achv.grant(a.id));
    Object.keys(CRIB_DECKS).forEach((d) => Achv.markCleared(d.replace("_asc", "")));
  });
  act("Own every card back + lens", () => {
    CARD_BACKS.forEach((b) => { Achv.addPegs(b.cost); Achv.buyBack(b.id); });
    LENSES.forEach((l) => { Achv.addPegs(l.cost); Achv.buyLens(l.id); });
  });
  act("Complete all trials", () => TRIALS.forEach((t) => Achv.markTrial(t.id)));

  // ---- run state
  sect("RUN");
  if (Cb.run) {
    const r = Cb.run;
    c.append(el("p", "small",
      `Act ${r.act}-${r.round} · ${r.street.name} · deck ${r.deckSize()} · charms ${r.charms.length}/${r.slots()}`));
    act("Skip ahead 5 rounds", () => { for (let i = 0; i < 5; i++) r.advance(); });
    act("Jump to Act 5", () => { r.act = 5; r.round = 1; });
    act("+5 banked skips", () => { r.skips += 5; });
    act("Give 5 random charms", () => {
      for (let i = 0; i < 5 && !r.isFull(); i++) {
        const pool = CCHARMS.filter((x) => !r.charms.some((y) => y.id === x.id));
        const pick = pool[Math.floor(Math.random() * pool.length)];
        if (pick) { r.charms.push(pick); if (pick.onAcquire) pick.onAcquire(r); }
      }
    });
    act("Give a Mythic charm", () => {
      const m = CCHARMS.filter((x) => x.rarity === "mythic");
      const pick = m[Math.floor(Math.random() * m.length)];
      if (pick && !r.isFull()) r.charms.push(pick);
    });
    act("Mark every deck card", () => {
      const keys = Object.keys(ENHANCEMENTS);
      for (const cd of r.cards)
        if (Math.random() < 0.4) cd.enh = keys[Math.floor(Math.random() * keys.length)];
    });
    act("Add 6 split cards", () => {
      for (let i = 0; i < 6; i++) {
        const o = rollCardOffer();
        o.card.rank2 = 1 + Math.floor(Math.random() * 13);
        o.card.suit2 = ["S", "H", "C", "D"][Math.floor(Math.random() * 4)];
        r.cards.push(o.card);
      }
    });
    act("Clear this round instantly", () => {
      if (Cb.round) { Cb.round.score = Cb.round.target * 2; }
    });
  } else {
    c.append(el("p", "small dim", "Start a run to see run-state tools."));
  }

  // ---- danger
  sect("DANGER");
  act("Wipe save", () => {
    try { localStorage.removeItem(Achv.KEY); localStorage.removeItem(Meta.KEY); } catch (e) {}
  }, "deletes all progress");

  c.append(btn("Back", showTitle, "small"));
  root().append(c);
}

</script>
