  renderGin();
}

/* Relics that bend the Rummy rules — this is the "break Rummy" axis. */
function ginMods() {
  const r = App.run ? App.run.relics : [];
  const has = (id) => r.some((x) => x.id === id);
  return {
    knockLimit: has("looseknock") ? 15 : 10,
    ginBonus: has("purist") ? 40 : 25,
    undercutBonus: has("counterpunch") ? 40 : 25,
  };
}

function renderGin() {
  const h = GinUI.hand;
  screen("gin");
  const c = el("div", "col tight");

  // scoreboard
  const sb = el("div", "panel col tight");
  sb.append(rowLR(`${ROSTER[GinUI.enemy].name}`, `${GinUI.scores.cpu}`, "red"));
  sb.append(bar(GinUI.scores.cpu / GinUI.target, "red"));
  sb.append(rowLR(`${ROSTER[App.run.meldling].name}`, `${GinUI.scores.player}`, "green"));
  sb.append(bar(GinUI.scores.player / GinUI.target, "green"));
  sb.append(el("p", "small gold", `First to ${GinUI.target} points`));
  c.append(sb);

  if (GinUI.lastResult) { c.append(ginSummary()); root().append(c); return; }

  // piles
  const piles = el("div", "row center gap arena");
  const stock = el("div", "pilewrap");
  const sb2 = backEl(1.6);
  sb2.classList.add("clickable");
  sb2.onclick = () => doDraw("stock");
  stock.append(sb2, el("p", "small dim", `STOCK ${h.stock.length}`));
  piles.append(stock);

  const dis = el("div", "pilewrap");
  const top = h.discard[h.discard.length - 1];
  const dn = top ? cardEl(top, 1.6) : el("div", "card empty");
  dn.classList.add("clickable");
  dn.onclick = () => doDraw("discard");
  dis.append(dn, el("p", "small dim", `DISCARD ${h.discard.length}`));
  piles.append(dis);
  c.append(piles);

  const browse = btn(`Look through discard (${h.discard.length})`, () => {
    GinUI.browsing = true; sfx("click"); renderGin();
  }, "small");
  c.append(browse);

  if (GinUI.browsing) c.append(discardViewer());

  // deadwood readout — the teaching device
  const arr = bestArrangement(h.player);
  const limit = ginMods().knockLimit;
  const dwClass = arr.deadwood === 0 ? "green" : arr.deadwood <= limit ? "gold" : "red";
  const dw = el("div", "panel col tight");
  dw.append(rowLR("DEADWOOD", String(arr.deadwood), dwClass));
  dw.append(el("p", "small dim",
    arr.deadwood === 0 ? "GIN — every card melded."
      : arr.deadwood <= limit ? `You may knock (limit ${limit}).`
      : `Knock at ${limit} or less.`));
  c.append(dw);

  c.append(el("p", "banner", GinUI.msg));

  // hand, grouped: melds first, deadwood after a gap
  const meldedIdx = new Set();
  arr.melds.forEach((m) => m.forEach((i) => meldedIdx.add(i)));
  const hand = el("div", "hand ginhand");
  const order = [];
  arr.melds.forEach((m, gi) => m.forEach((i) => order.push({ i, group: gi })));
  arr.deadwoodIdx.forEach((i) => order.push({ i, group: -1 }));

  order.forEach(({ i, group }, pos) => {
    const n = cardEl(h.player[i], 1.7);
    n.dataset.i = i;
    n.classList.add(group >= 0 ? "melded" : "dead");
    if (group >= 0 && order[pos - 1] && order[pos - 1].group !== group) n.classList.add("gapL");
    if (group === -1 && order[pos - 1] && order[pos - 1].group !== -1) n.classList.add("gapL");
    if (GinUI.sel === i) n.classList.add("sel");
    n.onclick = () => pickCard(i);
    hand.append(n);
  });
  c.append(hand);

  // actions
  const bar1 = el("div", "row gap");
  const phase = h.phase;
  const discardB = btn("DISCARD", doDiscard);
  discardB.disabled = phase !== "discard" || GinUI.sel < 0;
  const knockB = btn(arr.deadwood === 0 ? "GIN!" : "KNOCK", doKnock);
  knockB.disabled = !(phase === "discard" && GinUI.sel >= 0 && knockable());
  bar1.append(discardB, knockB);
  c.append(bar1);

  c.append(el("p", "small dim",
    phase === "draw" ? "Phase: DRAW — take the stock or the discard."
      : "Phase: DISCARD — pick a card to throw."));

  root().append(c);
}

function knockable() {
  const h = GinUI.hand;
  if (GinUI.sel < 0) return false;
  const kept = h.player.slice();
  kept.splice(kept.findIndex((_, i) => i === GinUI.sel), 1);
  return bestArrangement(kept).deadwood <= ginMods().knockLimit;
}

function discardViewer() {
  const h = GinUI.hand;
  const p = el("div", "panel col tight");
  p.append(el("p", "gold small", "DISCARD PILE — newest first"));
  const strip = el("div", "row wrap gap");
  h.discard.slice().reverse().forEach((card) => strip.append(cardEl(card, 1.1)));
  p.append(strip);
  p.append(btn("Close", () => { GinUI.browsing = false; renderGin(); }, "small"));
  return p;
}

function pickCard(i) {
  const h = GinUI.hand;
  if (h.phase !== "discard" || GinUI.busy) { sfx("bad"); return; }
  GinUI.sel = GinUI.sel === i ? -1 : i;
  sfx("select");
  renderGin();
}

function doDraw(src) {
  const h = GinUI.hand;
  if (h.phase !== "draw" || h.turn !== "player" || GinUI.busy) return;
  const c = src === "stock" ? h.drawStock("player") : h.drawDiscard("player");
  if (!c) { sfx("bad"); return; }
  sfx("draw");
  GinUI.msg = src === "stock"
    ? `Drew ${cardLabel(c)} from the stock.`
    : `Took ${cardLabel(c)} from the discard — the CPU saw that.`;
  GinUI.sel = -1;
  if (h.over) return finishHand();
  renderGin();
}

function doDiscard() {
  const h = GinUI.hand;
  if (h.phase !== "discard" || GinUI.sel < 0) return;
  const c = h.discardCard("player", GinUI.sel);
  if (!c) return;
  sfx("place");
  GinUI.sel = -1;
  GinUI.busy = true;
  renderGin();
  if (h.over) return finishHand();
  setTimeout(cpuTurn, 620);
}

function doKnock() {
  const h = GinUI.hand;
  if (GinUI.sel < 0) return;
  const r = h.knock("player", GinUI.sel);
  if (!r) { sfx("bad"); GinUI.msg = "Deadwood too high to knock."; renderGin(); return; }
  sfx(r.gin ? "GRAND MELD" : "RALLY");
  finishHand();
}

function cpuTurn() {
  const h = GinUI.hand;
  const before = h.discard.length;
  CpuGin.takeTurn(h);
  GinUI.busy = false;
  if (h.over) return finishHand();
  const took = h.discard.length < before;
  GinUI.msg = took
    ? `${ROSTER[GinUI.enemy].name} took your discard.`
    : `${ROSTER[GinUI.enemy].name} drew from the stock.`;
  renderGin();
}

function finishHand() {
  const h = GinUI.hand;
  const r = h.result || { wash: true, winner: null, points: 0 };
  if (r.winner === "player") GinUI.scores.player += r.points;
  else if (r.winner === "cpu") GinUI.scores.cpu += r.points;
  GinUI.lastResult = r;
  sfx(r.winner === "player" ? "win" : r.winner === "cpu" ? "lose" : "click");
  renderGin();
}

function ginSummary() {
  const r = GinUI.lastResult;
  const p = el("div", "panel col");
  let head = "HAND WASHED";
  if (r.gin) head = r.knocker === "player" ? "GIN!" : "CPU GOES GIN";
  else if (r.undercut) head = r.winner === "player" ? "UNDERCUT!" : "YOU WERE UNDERCUT";
  else if (r.winner) head = r.winner === "player" ? "YOU KNOCK" : "CPU KNOCKS";
  p.append(el("h3", r.winner === "player" ? "gold" : "red", head));

  if (!r.wash) {
    p.append(el("p", "small dim",
      `knocker deadwood ${r.knockerDw} · opponent ${r.oppDw}` +
      (r.laidOff ? ` · laid off ${r.laidOff}` : "")));
    p.append(el("p", "", `${r.points} points to ${r.winner === "player" ? "you" : ROSTER[GinUI.enemy].name}`));
  } else p.append(el("p", "small dim", "Stock ran out — no score."));

  const done = GinUI.scores.player >= GinUI.target || GinUI.scores.cpu >= GinUI.target;
  if (done) {
    const won = GinUI.scores.player >= GinUI.target;
    p.append(el("h3", won ? "gold" : "red", won ? "MATCH WON" : "MATCH LOST"));
    p.append(btn(won ? "Continue" : "End Run", () => {
      if (!won) { App.run.lastResult = "defeat"; return showEnd(); }
      App.run.essence += GinUI.target;
      App.node++;
      if (App.node >= GAUNTLET.length) { App.run.lastResult = "victory"; return showEnd(); }
      showReward(false);
    }, "big"));
  } else {
    p.append(btn("Next Hand", newGinHand, "big"));
  }
  return p;
}

/* Roguelite mode UI — the Balatro-shaped loop. */

const Rg = { run: null, round: null, sel: [], busy: false, pop: null };

/* ---------------------------------------------------------------- entry */
function showRogueSelect() {
  screen("rogueSelect");
  const c = el("div", "col");
  c.append(el("h2", "title", "CHOOSE YOUR MELDLING"));
  c.append(el("p", "dim small", "Each one starts you on a different build."));

  for (const id of Object.keys(MELDLING_DECKS)) {
    const d = MELDLING_DECKS[id];
    const b = el("button", "deckcard");
    const left = el("div", "");
    left.append(creatureEl(id, "idle", 2));
    const right = el("div", "col tight grow");
    right.append(el("div", "gold", `${d.name}  ${SUIT_SYM[d.suit]}`));
    right.append(el("div", "small dim", d.text));
    b.append(left, right);
    b.onclick = () => { sfx("RALLY"); Rg.run = new RogueRun(id); startRound(); };
    c.append(b);
  }
  c.append(btn("Back", showTitle, "small"));
  root().append(c);
}

/* ---------------------------------------------------------------- round intro */
function startRound() {
  const run = Rg.run;
  const boss = run.boss();
  screen("roundIntro");
  const c = el("div", "col center");
  c.append(el("p", "dim", `ACT ${run.act}  ·  ROUND ${run.round} / ${ROUNDS_PER_ACT}`));

  if (boss) {
    c.append(el("h2", "title red", boss.name));
    c.append(creatureEl(boss.art, "idle", 4));
    const warn = el("div", "panel bossbox");
    warn.append(el("div", "red", "BOSS RULE"));
    warn.append(el("div", "", boss.text));
    c.append(warn);
  } else {
    c.append(el("h2", "title", `TARGET ${run.target()}`));
    c.append(creatureEl(run.meldling, "idle", 4));
  }

  c.append(el("p", "gold", `Score ${run.target()} points`));
  c.append(el("p", "small dim",
    `${BASE_TURNS + run.rules().turnBonus} turns · ` +
    `${BASE_HAND + run.rules().handBonus} cards · ` +
    `${run.rules().noDig ? "no" : Math.max(0, BASE_DIGS + run.rules().digBonus)} digs`));
  if (run.charms.length) c.append(charmRow(run));
  c.append(btn("BEGIN", () => { Rg.round = new Round(run); Rg.sel = []; renderRound(); }, "big"));
  root().append(c);
}

function charmRow(run) {
  const row = el("div", "charmrow");
  for (const ch of run.charms) {
    const chip = el("div", `charm t${ch.tier}`);
    chip.append(el("div", "small", ch.name));
    chip.title = ch.text;
    row.append(chip);
  }
  if (!run.charms.length) row.append(el("div", "small dim", "no charms yet"));
  return row;
}

/* ---------------------------------------------------------------- round play */
function renderRound() {
  const rd = Rg.round, run = Rg.run;
  screen("round");
  const c = el("div", "col tight");

  // --- header
  const head = el("div", "panel col tight");
  const boss = run.boss();
  head.append(rowLR(`ACT ${run.act}-${run.round}${boss ? "  ·  " + boss.name : ""}`,
    `${rd.score} / ${rd.target}`, rd.score >= rd.target ? "green" : "gold"));
  head.append(bar(rd.score / rd.target, rd.score >= rd.target ? "green" : "red"));
  head.append(el("p", "small dim",
    `TURNS ${rd.turnsLeft}   DIGS ${rd.mods.noDig ? "—" : (rd.mods.freeDig ? "∞" : rd.digsLeft)}   ` +
    `DEADWOOD ${rd.deadwood()}`));
  if (boss) head.append(el("p", "small red", boss.text));
  c.append(head);

  c.append(charmRow(run));

  // --- tableau
  const tab = el("div", "tableau");
  if (!rd.table.length) tab.append(el("div", "small dim", "no melds laid yet"));
  rd.table.forEach((m) => {
    const chip = el("div", `meldchip ${m.kind}`);
    const sorted = m.cards.slice().sort((a, b) => a.rank - b.rank);
    chip.textContent = m.kind === "set"
      ? `${RANK_LABEL[sorted[0].rank]} ×${m.cards.length}`
      : `${SUIT_SYM[sorted[0].suit]} ${sorted.map((x) => RANK_LABEL[x.rank]).join("-")}`;
    if (m.kind === "prep") chip.textContent += "  (prep)";
    tab.append(chip);
  });
  c.append(tab);

  // --- piles
  const piles = el("div", "row center gap");
  const st = el("div", "pilewrap");
  const stc = backEl(1.3);
  if (rd.phase === "draw") { stc.classList.add("clickable"); stc.onclick = () => doRDraw("stock"); }
  st.append(stc, el("p", "small dim", `STOCK ${rd.stock.length}`));
  piles.append(st);

  const dp = el("div", "pilewrap");
  const top = rd.discard[rd.discard.length - 1];
  const dpc = (top && !rd.mods.noDig) ? cardEl(top, 1.3) : backEl(1.3);
  if (rd.phase === "draw" && rd.canDig()) { dpc.classList.add("clickable"); dpc.onclick = () => doRDraw("dig"); }
  dp.append(dpc, el("p", "small dim", rd.mods.noDig ? "FACE DOWN" : `DIG ${rd.discard.length}`));
  piles.append(dp);
  c.append(piles);

  c.append(el("p", "banner", rd.phase === "draw"
    ? "DRAW — take the stock, or dig the discard."
    : "LAY melds, then discard to end your turn."));

  // --- hand
  const hand = el("div", "hand roguehand");
  rd.hand.forEach((card, i) => {
    const n = cardEl(card, 1.5);
    n.dataset.i = i;
    if (Rg.sel.includes(i)) n.classList.add("sel");
    n.onclick = () => toggleRg(i);
    hand.append(n);
  });
  c.append(hand);

  // --- actions
  const selCards = Rg.sel.map((i) => rd.hand[i]);
  const kind = layKind(selCards, rd.mods);
  const offTarget = selCards.length === 1 ? extendTarget(selCards[0], rd.table) : null;

  const bar1 = el("div", "row gap");
  const layB = btn(kind ? `LAY ${kind.toUpperCase()}` : (offTarget ? "LAY OFF" : "LAY"), doRLay);
  layB.disabled = rd.phase !== "act" || (!kind && !offTarget) ||
    (rd.mods.oneLayPerTurn && rd.laysThisTurn >= 1);
  const disB = btn("DISCARD", doRDiscard, "small");
  disB.disabled = rd.phase !== "act" || Rg.sel.length !== 1;
  bar1.append(layB, disB);
  c.append(bar1);

  if (rd.score >= rd.target)
    c.append(btn("CASH OUT — target met", doCashOut, "big"));

  // --- preview of the lay
  if (kind || offTarget) {
    const probe = rd.scoreLay(kind ? selCards : selCards, kind || (offTarget.kind === "prep" ? "prep" : offTarget.kind));
    c.append(el("p", "small blue",
      `${probe.base} base × ${probe.mult.toFixed(2)} = ${probe.total}` +
      (probe.fired.length ? `   [${probe.fired.join(", ")}]` : "")));
  }

  root().append(c);
  if (Rg.pop) { showPop(Rg.pop); Rg.pop = null; }
}

function toggleRg(i) {
  const rd = Rg.round;
  if (rd.phase !== "act") { sfx("bad"); return; }
  const at = Rg.sel.indexOf(i);
  if (at >= 0) Rg.sel.splice(at, 1); else Rg.sel.push(i);
  sfx("select");
  renderRound();
}

function doRDraw(src) {
  const rd = Rg.round;
  const c = rd.draw(src);
  if (!c) { sfx("bad"); return; }
  sfx(src === "dig" ? "place" : "draw");
  Rg.sel = [];
  if (rd.over) return endRound();
  renderRound();
}

function doRLay() {
  const rd = Rg.round;
  const selCards = Rg.sel.map((i) => rd.hand[i]);
  const kind = layKind(selCards, rd.mods);
  let res = null;
  if (kind) res = rd.layMeld(Rg.sel.slice());
  else if (selCards.length === 1) res = rd.layOff(Rg.sel[0]);
  if (!res) { sfx("bad"); return; }
  sfx(kind === "run" ? "STRIKE" : kind === "set" ? "RALLY" : "PREP");
  Rg.sel = [];
  Rg.pop = res;
  renderRound();
}

function doRDiscard() {
  const rd = Rg.round;
  if (Rg.sel.length !== 1) return;
  rd.discardCard(Rg.sel[0]);
  sfx("place");
  Rg.sel = [];
  if (rd.over) return endRound();
  renderRound();
}

function doCashOut() {
  Rg.round.cashOut();
  endRound();
}

function showPop(res) {
  const p = el("div", "scorepop");
  p.innerHTML = `<span class="gold">${res.base}</span> × ` +
    `<span class="blue">${res.mult.toFixed(2)}</span> = ` +
    `<span class="big">${res.total}</span>`;
  if (res.fired.length) {
    const f = el("div", "small gold", res.fired.join(" · "));
    p.append(f);
  }
  root().append(p);
  setTimeout(() => p.remove(), 1100);
}

/* ---------------------------------------------------------------- results */
function endRound() {
  const rd = Rg.round, run = Rg.run;
  if (!rd.over) rd.settle();
  else if (rd.essenceEarned === undefined) rd.settle();
  sfx(rd.won ? "win" : "lose");

  screen("roundEnd");
  const c = el("div", "col center");
  c.append(el("h2", rd.won ? "title" : "title red", rd.won ? "ROUND CLEARED" : "RUN OVER"));
  const box = el("div", "panel col tight");
  box.append(rowLR("Score", `${rd.score} / ${rd.target}`, rd.won ? "green" : "red"));
  box.append(rowLR("Melds laid", String(rd.laid.length)));
  box.append(rowLR("Deadwood", `-${rd.deadwoodPenalty}`, "red"));
  if (rd.goneOut) box.append(rowLR("Went out", "+6 essence", "gold"));
  if (rd.won) box.append(rowLR("Essence earned", `+${rd.essenceEarned}`, "gold"));
  c.append(box);

  if (!rd.won) {
    c.append(el("p", "dim", `Reached Act ${run.act}, Round ${run.round} of ${ROUNDS_PER_ACT}.`));
    c.append(btn("New Run", showRogueSelect, "big"));
    c.append(btn("Title", showTitle, "small"));
  } else {
    run.essence += rd.essenceEarned;
    c.append(btn("SHOP", showShop, "big"));
  }
  root().append(c);
}

/* ---------------------------------------------------------------- shop */
function showShop() {
  const run = Rg.run;
  screen("shop");
  const c = el("div", "col");
  c.append(el("h2", "title", "THE SANCTUM"));
  c.append(el("p", "gold", `${run.essence} Essence`));
  c.append(charmRow(run));

  const offer = run.shopOffer(3);
  if (!offer.length) c.append(el("p", "dim", "Nothing left to buy."));
  for (const ch of offer) {
    const b = el("button", `shopitem t${ch.tier}`);
    const l = el("div", "col tight grow");
    l.append(el("div", "gold", `${ch.name}   ${["", "·", "··", "···"][ch.tier]}`));
    l.append(el("div", "small dim", ch.text));
    b.append(l, el("div", "cost", String(ch.cost)));
    b.disabled = ch.cost > run.essence;
    b.onclick = () => {
      if (ch.cost > run.essence) return;
      run.essence -= ch.cost;
      run.charms.push(ch);
      sfx("GRAND MELD");
      showShop();
    };
    c.append(b);
  }

  c.append(btn("NEXT ROUND", () => {
    const done = run.advance();
    if (done) { screen("won"); return showRunWon(); }
    startRound();
  }, "big"));
  root().append(c);
}

function showRunWon() {
  const run = Rg.run;
  const c = el("div", "col center");
  c.append(el("h2", "title", "GAUNTLET BROKEN"));
  c.append(creatureEl(run.meldling, "idle", 5));
  c.append(el("p", "gold", `All ${ACTS * ROUNDS_PER_ACT} rounds cleared.`));
  c.append(charmRow(run));
  c.append(btn("New Run", showRogueSelect, "big"));
  root().append(c);
}

/* The cascade. This is the payoff moment, so it gets the most work:
   - the cards that scored each sub-total light up as it's counted
   - the running number climbs digit by digit with a rising pentatonic tick
   - the multiplier lands with a slam, screen shake and a pip burst
   - the Meldling reacts to how big it was */

/* Score tiers — a hand at 3x pace must FEEL different from one at pace. */
const TIERS = [
  { at: 0.00, word: "",            cls: "",      pips: 0,  chord: [261.63, 329.63] },
  { at: 0.55, word: "SOLID",       cls: "t-ok",  pips: 12, chord: [261.63, 329.63, 392] },
  { at: 1.20, word: "STRONG",      cls: "t-good",pips: 18, chord: [261.63, 329.63, 392, 523.25] },
  { at: 2.00, word: "HUGE",        cls: "t-big", pips: 26, chord: [261.63, 392, 523.25, 659.25] },
  { at: 3.20, word: "MASSIVE",     cls: "t-max", pips: 36, chord: [329.63, 523.25, 659.25, 783.99, 1046.5] },
];
function tierFor(ratio) {
  let t = TIERS[0];
  for (const x of TIERS) if (ratio >= x.at) t = x;
  return t;
}

/* Animation speed — Balatro ships a global speed control because a long run is
   mostly waiting on the same animation. With ~100 counts per run, so do we. */
const Speed = {
  levels: [1, 2, 4],
  i: 0,
  get k() { return this.levels[this.i]; },
  ms(t) { return Math.max(24, Math.round(t / this.k)); },
  cycle() { this.i = (this.i + 1) % this.levels.length; return this.k; },
  label() { return `${this.k}×`; },
};

const Juice = {
  /* ---------------------------------------------------------- particles */
  burst(x, y, count = 14, colors = ["gold", "white", "blue"]) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "pip";
      p.style.backgroundImage = `url(${ART.pips[colors[i % colors.length]]})`;
      p.style.left = x + "px";
      p.style.top = y + "px";
      document.body.appendChild(p);
      const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist = 60 + Math.random() * 130;
      const dur = 480 + Math.random() * 420;
      p.animate([
        { transform: "translate(-50%,-50%) scale(1.4)", opacity: 1 },
        { transform: `translate(${Math.cos(ang) * dist - 50}%, ${Math.sin(ang) * dist + 120}%) scale(0.4)`, opacity: 0 },
      ], { duration: dur, easing: "cubic-bezier(.2,.7,.3,1)" });
      setTimeout(() => p.remove(), dur);
    }
  },

  shake(strength = 6, dur = 260) {
    const a = document.getElementById("app");
    if (!a) return;
    const frames = [];
    for (let i = 0; i < 7; i++) {
      const s = strength * (1 - i / 7);
      frames.push({ transform: `translate(${(Math.random() * 2 - 1) * s}px, ${(Math.random() * 2 - 1) * s}px)` });
    }
    frames.push({ transform: "translate(0,0)" });
    a.animate(frames, { duration: dur, easing: "ease-out" });
  },

  /* Count a number up rather than snapping to it. */
  countTo(node, from, to, ms, onTick) {
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      const eased = 1 - Math.pow(1 - k, 3);
      const v = Math.round(from + (to - from) * eased);
      node.textContent = String(v);
      if (onTick) onTick(v);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  flashNumber(node) {
    node.classList.remove("pulse");
    void node.offsetWidth;
    node.classList.add("pulse");
  },
};

/* ---------------------------------------------------------------- cascade */
function cribCascade(res, keepRank, hand, starter, scoreBefore, done) {
  const rd = Cb.round, run = Cb.run;
  screen("cascade");
  const c = el("div", "col center cascadewrap");

  // goal and items stay on screen while the count happens
  c.append(cribHUD(rd, run, { shownScore: scoreBefore }));
  const charms = cribCharmRow(run);
  charms.classList.add("cascadecharms");
  c.append(charms);

  // the Meldling watches the count and reacts to the slam
  const critter = creatureEl(run.meldling, "idle", 3);
  critter.id = "cascadeCritter";
  c.append(critter);

  // the counted hand stays on screen so highlights mean something
  const row = el("div", "row center cascadecards");
  const all = hand.concat([starter]);
  // scale to fit however many cards were counted (Facet keeps 5, so 6 total)
  const cs = all.length >= 6 ? 1.0 : all.length === 5 ? 1.15 : 1.3;
  all.forEach((card, i) => {
    const n = cardEl(card, cs);
    n.classList.add("ccard");
    if (i === all.length - 1) n.classList.add("starter");
    n.dataset.k = card.rank + card.suit;
    row.append(n);
  });
  c.append(row);

  const total = el("h1", "bignum", "0");
  c.append(total);

  const list = el("div", "col tight cascadelist");
  c.append(list);

  const multLine = el("div", "multline", "");
  c.append(multLine);
  const spd = el("button", "speedbtn", `▸ ${Speed.label()}`);
  spd.onclick = (e) => { e.stopPropagation(); Speed.cycle(); spd.textContent = `▸ ${Speed.label()}`; };
  c.append(spd);
  root().append(c);

  const cardNodes = {};
  row.querySelectorAll(".ccard").forEach((n) => { (cardNodes[n.dataset.k] ||= []).push(n); });

  const lightUp = (cards, kind) => {
    row.querySelectorAll(".ccard").forEach((n) => n.classList.remove("lit", "k-fifteen", "k-pair", "k-run", "k-flush", "k-nobs"));
    for (const card of cards) {
      const key = card.rank + card.suit;
      (cardNodes[key] || []).forEach((n) => { n.classList.add("lit", "k-" + kind); });
    }
  };

  let running = 0;
  const evs = res.events.slice();
  let idx = 0;

  /* Ramp level blends how much you've banked against how far through the count we
     are — so a monster hand audibly climbs higher than a weak one. */
  const pace = Math.max(1, rd.target / (CRIB_DEALS + rd.mods.dealBonus));
  const evCount = Math.max(3, res.events.length + (res.levelBonus ? 1 : 0));
  const rampLevel = () =>
    Math.min(1, (running / (pace * 2.6)) * 0.7 + (idx / evCount) * 0.3);
  Audio16.rampStart();
  Audio16.rampTo(0.05, 0.2);

  const step = () => {
    if (!evs.length) {
      if (!res.events.length) {
        // nothing scored — say so rather than silently sliding to the slam
        const rowEl = el("div", "casrow k-zero");
        rowEl.append(el("div", "casicon lvicon"), el("span", "grow", "No score"),
          el("span", "casval", "0"));
        list.append(rowEl);
        Audio16.sfx("bad");
      }
      return levelStep();
    }
    const e = evs.shift();
    lightUp(e.cards, e.kind);

    const rowEl = el("div", "casrow k-" + e.kind);
    const icon = el("div", "casicon");
    icon.style.backgroundImage = `url(${ART.icons[e.kind] || ART.icons.fifteen})`;
    rowEl.append(icon, el("span", "grow", e.label), el("span", "casval", `+${e.points}`));
    list.append(rowEl);
    if (list.children.length > 6) list.firstChild.remove();

    const from = running;
    running += e.points;
    Juice.countTo(total, from, running, Speed.ms(220));
    Juice.flashNumber(total);
    if (res.isCrib) Audio16.cribTick(idx++); else Audio16.tick(idx++, e.kind);
    Audio16.rampTo(rampLevel());
    setTimeout(step, Speed.ms(380));
  };

  const gildStep = () => {
    if (!res.gildBonus) return cutStep();
    const rowEl = el("div", "casrow k-gild");
    rowEl.append(el("div", "casicon gildicon"), el("span", "grow", "Gilded cards"),
      el("span", "casval", `+${res.gildBonus}`));
    list.append(rowEl);
    Audio16.voice(1245, 0.16, { gain: 0.09, type: "square", detune: 12, send: 0.4 });
    setTimeout(cutStep, Speed.ms(400));
  };

  const cutStep = () => {
    if (!res.cutGain) return suppressStep();
    const rowEl = el("div", "casrow k-cut");
    const ic = el("div", "casicon cuticon");
    rowEl.append(ic, el("span", "grow", "From the cut"),
      el("span", "casval", `+${res.cutGain}`));
    list.append(rowEl);
    Audio16.voice(660, 0.14, { gain: 0.09, type: "square", detune: 9, send: 0.35 });
    setTimeout(suppressStep, Speed.ms(420));
  };

  const suppressStep = () => {
    if (!res.suppressed) return chainStep();
    const rowEl = el("div", "casrow k-block");
    rowEl.append(el("div", "casicon blockicon"),
      el("span", "grow", `${res.suppressedBy} blocked`),
      el("span", "casval", `−${res.suppressed}`));
    list.append(rowEl);
    Audio16.sfx("bad");
    Juice.shake(4, 200);
    setTimeout(chainStep, Speed.ms(520));
  };

  const levelStep = () => {
    if (!res.levelBonus) return gildStep();
    const rowEl = el("div", "casrow k-level");
    rowEl.append(el("div", "casicon lvicon"), el("span", "grow", "Category levels"),
      el("span", "casval", `+${res.levelBonus}`));
    list.append(rowEl);
    const from = running;
    running += res.levelBonus;
    Juice.countTo(total, from, running, 260);
    Juice.flashNumber(total);
    Audio16.voice(1046, 0.18, { gain: 0.1, type: "square", detune: 10, send: 0.35 });
    setTimeout(multStep, 460);
  };

  /* Each charm triggers in sequence, chip bouncing, running total climbing —
     this is what teaches players which combinations matter. */
  const chainStep = () => {
    const steps = (res.steps || []).slice();
    if (!steps.length) return multStep();
    multLine.innerHTML = `<span class="mbase">${res.baseOnly}</span>`;
    multLine.classList.add("in");
    let cur = res.baseOnly;
    Juice.countTo(total, running, cur, Speed.ms(240));

    const fire = () => {
      if (!steps.length) return setTimeout(multStep, Speed.ms(360));
      const st = steps.shift();
      charms.querySelectorAll(".charm").forEach((ch) => {
        const label = ch.querySelector(".charmname");
        if (label && label.textContent === st.name) {
          ch.classList.add("firing");
          setTimeout(() => ch.classList.remove("firing"), Speed.ms(420));
        }
      });
      const rowEl = el("div", "casrow k-charm");
      rowEl.append(el("div", "casicon charmicon"), el("span", "grow", st.name),
        el("span", "casval", `+${st.gain}`));
      list.append(rowEl);
      if (list.children.length > 7) list.firstChild.remove();
      Juice.countTo(total, cur, st.total, Speed.ms(260));
      Juice.flashNumber(total);
      cur = st.total;
      multLine.innerHTML =
        `<span class="mbase">${st.base}</span><span class="mx">×</span>` +
        `<span class="mmult">${st.mult.toFixed(2)}</span>`;
      Audio16.tick(idx++, "pair");
      Audio16.rampTo(Math.min(1, cur / (pace * 2.2)));
      setTimeout(fire, Speed.ms(300));
    };
    setTimeout(fire, Speed.ms(300));
  };

  const multStep = () => {
    row.querySelectorAll(".ccard").forEach((n) => n.classList.add("lit", "k-all"));
    // each contributing charm lights up in turn, so you SEE what earned it
    res.fired.forEach((name, i) => {
      setTimeout(() => {
        charms.querySelectorAll(".charm").forEach((ch) => {
          const label = ch.querySelector(".charmname");
          if (label && label.textContent === name) {
            ch.classList.add("firing");
            setTimeout(() => ch.classList.remove("firing"), 420);
          }
        });
        Audio16.voice(880 + i * 110, 0.1, { gain: 0.07, type: "square", send: 0.3 });
      }, i * 130);
    });

    multLine.innerHTML =
      `<span class="mbase">${res.base}</span><span class="mx">×</span>` +
      `<span class="mmult">${res.mult.toFixed(2)}</span>`;
    multLine.classList.add("in");
    Audio16.rampTo(Math.min(1, Math.max(rampLevel(), res.total / (pace * 1.6))), 0.5);

    setTimeout(() => {
      const pace = rd.target / (CRIB_DEALS + rd.mods.dealBonus);
      const ratio = res.total / Math.max(1, pace);
      const tier = tierFor(ratio);
      const perfect = res.base >= 29 && !res.levelBonus;

      Audio16.rampBurst();
      Audio16.slam(1 + Math.min(2, ratio));
      tier.chord.forEach((f, i) =>
        Audio16.voice(f, 0.7, { gain: 0.075, type: "square", detune: 11,
          delay: 0.06 + i * 0.045, send: 0.45 }));
      Juice.shake(5 + Math.min(16, ratio * 5), 320);
      const r = total.getBoundingClientRect();
      Juice.burst(r.left + r.width / 2, r.top + r.height / 2,
        16 + tier.pips, tier.cls === "t-max" ? ["gold", "green", "white"] : ["gold", "white", "blue"]);
      Juice.countTo(total, running, res.total, 620);
      // the goal bar fills as the points land — the payoff and the goal, together
      const hudScore = document.getElementById("hudScore");
      const hudBar = document.getElementById("hudBar");
      if (hudScore) Juice.countTo(hudScore, scoreBefore, rd.score, 640);
      Audio16.setProximity(Math.min(1, rd.score / rd.target));
      if (hudBar) {
        const fill = hudBar.querySelector(".fill");
        if (fill) {
          fill.style.transition = "width .64s cubic-bezier(.2,.8,.3,1)";
          fill.style.width = Math.min(100, 100 * rd.score / rd.target) + "%";
          if (rd.score >= rd.target) fill.classList.add("green");
        }
      }
      total.classList.add("huge");
      if (tier.cls) total.classList.add(tier.cls);
      Juice.flashNumber(total);

      // the creature reacts
      const cr = document.getElementById("cascadeCritter");
      if (cr) playAnim(cr, run.meldling, ratio >= 0.55 ? "attack" : "hurt", 3);

      if (tier.word) {
        const w = el("h2", "tierword " + tier.cls, tier.word);
        c.append(w);
      }
      if (perfect) {
        c.append(el("h2", "tierword t-max", "TWENTY-NINE"));
        Audio16.sfx("milestone");
        Juice.burst(window.innerWidth / 2, window.innerHeight * 0.35, 44, ["gold", "white", "green"]);
      }



      setTimeout(() => {
        // coaching: what the best keep would have scored
        // coach on the DECISION, not on hindsight: how did your keep rank by EV?
        if (keepRank && keepRank.rank) {
          const good = keepRank.rank === 1;
          const near = keepRank.rank <= 3;
          c.append(el("p", "small " + (good ? "green" : near ? "gold" : "dim"),
            good ? "Best possible keep."
              : `Keep ranked ${keepRank.rank} of ${keepRank.of} by expected value` +
                (keepRank.best ? `  (best expected ${keepRank.best.ev.toFixed(1)})` : "")));
        }

        // "I'd have lost without that" — say it out loud
        if (res.crossedTarget) {
          const cutSaved = res.scoreBefore + res.handOnly < rd.target;
          let line = null, cls = "t-good";
          if (cutSaved) { line = "THE CUT SAVED IT"; cls = "t-big"; }
          else {
            let bestCharm = null;
            for (const k in (res.contrib || {}))
              if (res.scoreBefore + res.total - res.contrib[k] < rd.target &&
                  (!bestCharm || res.contrib[k] > res.contrib[bestCharm])) bestCharm = k;
            if (bestCharm) { line = `${bestCharm.toUpperCase()} SAVED IT`; cls = "t-big"; }
          }
          if (res.wasFinalDeal && !line) { line = "ON THE LAST DEAL"; cls = "t-good"; }
          if (line) {
            const w = el("h2", "clutch " + cls, line);
            c.append(w);
            Audio16.sfx("milestone");
            Juice.burst(window.innerWidth / 2, window.innerHeight * 0.42, 30,
              ["gold", "white", "green"]);
            Juice.shake(8, 320);
          }
        }

        // did we just cross the target?
        if (rd.score >= rd.target && !rd.milestoneShown) {
          rd.milestoneShown = true;
          const m = el("h2", "title green", "TARGET MET");
          c.append(m);
          Audio16.sfx("milestone");
          Juice.burst(window.innerWidth / 2, window.innerHeight * 0.4, 26, ["gold", "green", "white"]);
        }
        c.append(btn("CONTINUE", done, "big"));
      }, 720);
    }, 620);
  };

  setTimeout(step, Speed.ms(420));
}

/* Cribbage mode UI. The count-up cascade is the whole point — every sub-score
   ticks in sequence with a running total, then the multiplier lands. */

/* Cross-run persistence — the "one more run" hook. This is a standalone local
   file, so localStorage is available and appropriate here. */
const Meta = {
  KEY: "meldlings.meta.v1",
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || "{}"); } catch (e) { return {}; } },
  save(o) { try { localStorage.setItem(this.KEY, JSON.stringify(o)); } catch (e) {} },
  record(run, reached, score) {
    const m = this.load();
    m.runs = (m.runs || 0) + 1;
    m.bestRound = Math.max(m.bestRound || 0, reached);
    m.bestScore = Math.max(m.bestScore || 0, score || 0);
    if (reached >= CRIB_ACTS * CRIB_ROUNDS) m.clears = (m.clears || 0) + 1;
    m.decks = m.decks || {};
    m.decks[run.meldling] = Math.max(m.decks[run.meldling] || 0, reached);
    this.save(m);
    return m;
  },
  line() {
    const m = this.load();
    if (!m.runs) return "No runs yet.";
    const act = Math.ceil((m.bestRound || 1) / CRIB_ROUNDS);
    const rd = ((m.bestRound - 1) % CRIB_ROUNDS) + 1;
    return `Runs ${m.runs}  ·  Best Act ${act}-${rd}  ·  Cleared ${m.clears || 0}  ·  Best hand ${m.bestScore || 0}`;
  },
};

}

/* A system unlock is a bigger deal than a deed, so it gets the screen. */
function announceSystem(sys) {

/* Steam-style deed notifications: bottom-right, queued, slide in and out. */
const DeedQueue = { items: [], busy: false };
function announceDeeds(ids) {
  for (const id of ids) {
    const a = ACHIEVEMENTS.find((x) => x.id === id);
    if (a) DeedQueue.items.push(a);
  }
  pumpDeeds();
}
function pumpDeeds() {
  if (DeedQueue.busy || !DeedQueue.items.length) return;
  DeedQueue.busy = true;
  const a = DeedQueue.items.shift();

  const t = el("div", "deedtoast");
  const icon = el("div", "deedicon", "★");
  const body = el("div", "col tight grow");
  body.append(el("div", "deedkicker", "DEED UNLOCKED"));
  body.append(el("div", "deedname", a.name));
  body.append(el("div", "small dim", a.text));
  t.append(icon, body);
  document.body.append(t);

  Audio16.voice(880, 0.09, { type: "square", gain: 0.09, send: 0.3 });
  Audio16.voice(1318, 0.16, { type: "square", gain: 0.08, delay: 0.09, send: 0.35 });
  Audio16.voice(1760, 0.3, { type: "square", gain: 0.06, delay: 0.19, send: 0.4, detune: 8 });

  setTimeout(() => t.classList.add("out"), 3400);
  setTimeout(() => {
    t.remove();
    DeedQueue.busy = false;
    pumpDeeds();
  }, 3900);
}

function charmChip(ch, opts = {}) {
  const rar = ch.rarity || (ch.tier === 0 ? "deckbonus" : "common");
  const chip = el("div", "charm r-" + rar);
  const plq = el("div", "charmgem");
  if (ART.rarity && ART.rarity[rar]) plq.style.backgroundImage = `url(${ART.rarity[rar]})`;
  const cat = el("div", "charmcat");
  const catSrc = (ART.icons && ART.icons[ch.cat]) || (ART.cats && ART.cats[ch.cat]);
  if (catSrc) cat.style.backgroundImage = `url(${catSrc})`;
  plq.append(cat);
  chip.append(plq, el("div", "charmname", ch.name));
  tip(chip, ch.name + (ch.rarity ? `  ·  ${RARITY[ch.rarity].name}` : ""),
    ch.text || "Your Meldling's own knack.");
  if (opts.onSell) {
    const x = el("button", "sellx", "×");
    x.title = "Sell";
    x.onclick = (e) => { e.stopPropagation(); opts.onSell(ch); };
    chip.append(x);
  }
  return chip;
}

/* The HUD. Pinned to both the table and the count screen so the goal never
   leaves the screen — the single biggest clarity gap the audit found. */
function cribHUD(rd, run, opts = {}) {
  const wrap = el("div", "panel col tight hud");
  const boss = run.boss();

  const top = el("div", "row between");
  top.append(el("span", "small dim", `ACT ${run.act}-${run.round}`));
  if (boss) {
    const chip = el("span", `bosschip sev${boss.sev}`, boss.name);
    if (boss.align) chip.textContent = `${boss.name} ${SUIT_SYM[boss.align]}`;
    chip.title = boss.text;
    top.append(chip);
  }
  top.append(el("span", "small dim", `DEAL ${Math.min(rd.dealIndex + 1, rd.dealsLeft + rd.dealIndex)}`));
  wrap.append(top);

  const shown = opts.shownScore !== undefined ? opts.shownScore : rd.score;
  const scoreRow = el("div", "row between scoreline");
  const sc = el("span", "hudscore", String(shown));
  sc.id = "hudScore";
  scoreRow.append(sc, el("span", "hudtarget", `/ ${rd.target}`));
  wrap.append(scoreRow);

  const b = bar(shown / rd.target, shown >= rd.target ? "green" : "red");
  b.id = "hudBar";
  wrap.append(b);

  if (run.skips > 0 || run.surplus > 0) {
    const sr = el("div", "row between small");
    sr.append(el("span", "gold", `SURPLUS ${run.surplus}/${SURPLUS_PER_SKIP}`));
    if (run.skips > 0) sr.append(el("span", "green", `${run.skips} SKIP${run.skips > 1 ? "S" : ""} BANKED`));
    wrap.append(sr);
  }
  const need = Math.max(0, rd.target - shown);
  const deals = Math.max(1, rd.dealsLeft);
  const per = Math.ceil(need / deals);
  const pace = el("div", "row between small");
  if (need === 0) {
    pace.append(el("span", "green", "TARGET MET"),
                el("span", "green", "cash out any time"));
  } else {
    const tight = per > 60;
    pace.append(el("span", tight ? "red" : "gold", `NEED ${need}`),
      el("span", "dim", `${rd.dealsLeft} deal${rd.dealsLeft === 1 ? "" : "s"} left`),
      el("span", tight ? "red" : "dim", `${per} / deal`));
  }
  wrap.append(pace);
  if (boss) wrap.append(el("p", `small sev${boss.sev}`, boss.text +
    (rd.mods.deadSuit ? `  (${SUIT_SYM[rd.mods.deadSuit]} is ash)` : "")));
  return wrap;
}

function cribCharmRow(run, opts = {}) {
  const row = el("div", "charmrow");
  const list = run.activeCharms();
  const offset = list.length - run.charms.length;   // deck bonus sits first and is innate
  list.forEach((ch, i) => {
    const chip = charmChip(ch, ch.tier === 0 ? {} : opts);
    if (opts.reorder && ch.tier !== 0) {
      const slot = i - offset;
      chip.classList.add("movable");
      if (Cb.pickedCharm === slot) chip.classList.add("picked");
      chip.onclick = () => {
        if (Cb.pickedCharm === null || Cb.pickedCharm === undefined) {
          Cb.pickedCharm = slot;
        } else if (Cb.pickedCharm === slot) {
          Cb.pickedCharm = null;
        } else {
          run.moveCharm(Cb.pickedCharm, slot);
          Cb.pickedCharm = null;
          sfx16("place");
        }
        opts.rerender();
      };
    }
    row.append(chip);
  });
  for (let i = run.charms.length; i < run.slots(); i++)
    row.append(el("div", "charm empty", ""));
  return row;
}

/* Charms resolve left to right. An additive charm before a multiplier is worth
   far more than after it, so the order is a puzzle in itself. */
function charmOrderPanel(run) {
  const box = el("div", "panel col tight");
  box.append(sectionHead("CHARM ORDER", "they resolve left to right"));
  box.append(cribCharmRow(run, { reorder: true, rerender: showCribShop }));
  box.append(el("p", "tiny dim", Cb.pickedCharm === null || Cb.pickedCharm === undefined
    ? "Tap a charm, then tap where it should go."
    : "Now tap the slot to move it to."));

  if (run.charms.length >= 2 && Cb.orderProbe) {
    const p = Cb.orderProbe;
    box.append(el("p", "small " + (p.gain > 0 ? "gold" : "dim"),
      p.gain > 0 ? `A better arrangement exists — worth about ${p.gain} more on a typical hand.`
                 : "This is the strongest arrangement for a typical hand."));
  }
  const test = btn("Test arrangement", () => {
    const rd = Cb.round || new CribRound(run);
    if (!rd.dealt) rd.newDeal();
    const hand = rd.bestKeepEV().idx.map((i) => rd.dealt[i]);
    if (!rd.starter) rd.cutStarter();
    const cur = run.scoreWithOrder(rd, hand, [...Array(run.charms.length).keys()]);
    const best = run.bestOrder(rd, hand);
    Cb.orderProbe = { gain: best ? Math.max(0, best.total - cur) : 0 };
    sfx16("click");
    showCribShop();
  }, "small");
  box.append(test);
  return box;
}

function cribLevelRow(run) {
  const row = el("div", "charmrow");
  for (const cat of LEVEL_CATS) {
    const lv = run.levels[cat];
    const chip = el("div", "lvchip" + (lv ? " on" : ""));
    chip.textContent = `${cat} ${lv}`;
    row.append(chip);
  }
  return row;
}

/* ---------------------------------------------------------------- play */
function renderCrib() {
  const rd = Cb.round, run = Cb.run;
  screen("crib");
  const c = el("div", "col tight");

  c.append(cribHUD(rd, run));
  c.append(cribCharmRow(run));

  // the cut — unknown until you commit, unless you own Foresight
  const st = el("div", "row center gap");
  if (rd.starter) {
    const w = el("div", "pilewrap");
    const n = cbCard(rd.starter, 1.5); n.classList.add("starterflip");
    w.append(n, el("p", "small gold", "STARTER"));
    st.append(w);
    if (rd.starter2) {
      const w2 = el("div", "pilewrap");
      const n2 = cbCard(rd.starter2, 1.5); n2.classList.add("starterflip");
      w2.append(n2, el("p", "small gold", "STARTER 2"));
      st.append(w2);
    }
    if (rd.recutsLeft > 0)
      st.append(btn("Recut", () => { rd.recut(); sfx16("cut"); renderCrib(); }, "small"));
  } else {
    const w = el("div", "pilewrap");
    const n = backEl(1.5); n.classList.add("cutwait");
    w.append(n, el("p", "small dim", "THE CUT"));
    st.append(w);
    st.append(el("p", "small dim cutnote",
      "Cut after you commit. Keep for expected value, not for certainty."));
  }
  c.append(st);

  // ---- the Table: reference material, collapsed unless you've pinned it
  const pinCrib = Achv.lensOn("crib");
  const pinDeck = Achv.lensOn("counter");
  const pinCharms = Achv.lensOn("ledger");

  const cribBlock = () => {
    const w = el("div", "cribwrap");
    const h = el("div", "row between");
    h.append(el("span", "small gold", `YOUR CRIB  (${rd.crib.length}/${CRIB_SIZE})`),
      el("span", "small dim", rd.mods.cribZero ? "scores nothing"
        : rd.crib.length >= CRIB_SIZE ? "full — later throws burn"
        : `first ${CRIB_SIZE} throws land here`));
    w.append(h);
    const r = el("div", "cribrow");
    if (!rd.crib.length) r.append(el("div", "small dim", "empty"));
    for (const cc of rd.crib) r.append(cardEl(cc, 0.8));
    w.append(r);
    return w;
  };
  const deckBlock = () => {
    const w = el("div", "col tight");
    if (rd.mods.hideTracker) {
      w.append(el("p", "small red", "The Fog — your tracker is hidden this round."));
      return w;
    }
    const trk = el("div", "decktrack");
    const hist = rd.remainingHistogram();
    for (let r = 1; r <= 13; r++) {
      const n = hist[r] || 0;
      const cell = el("div", "trkcell" + (n === 0 ? " gone" : ""));
      cell.append(el("div", "trkr", CRANK_LABEL[r]));
      cell.append(el("div", "trkn", String(n)));
      trk.append(cell);
    }
    w.append(trk);
    return w;
  };

  if (pinCharms) c.append(cribCharmRow(run));
  if (pinCrib) c.append(cribBlock());
  if (pinDeck) c.append(deckBlock());

  // one compact strip that always tells you the state, and opens the rest
  const strip = el("button", "tablestrip");
  strip.append(el("span", "small",
    `TABLE  ·  deck ${rd.stock.length}  ·  crib ${rd.crib.length}/${CRIB_SIZE}  ·  cycle ${rd.cycle}`));
  strip.append(el("span", "small gold", Cb.tableOpen ? "hide ▲" : "show ▼"));
  strip.onclick = () => { Cb.tableOpen = !Cb.tableOpen; sfx16("click"); renderCrib(); };
  c.append(strip);

  if (Cb.tableOpen) {
    const drawer = el("div", "col tight tabledrawer");
    if (!pinCharms) drawer.append(cribCharmRow(run));
    if (!pinCrib) drawer.append(cribBlock());
    if (!pinDeck) drawer.append(deckBlock());
    const opts = el("div", "row gap wrap");
    opts.append(btn(`Animation ${Speed.label()}`, () => { Speed.cycle(); renderCrib(); }, "small"));
    opts.append(btn(`Build-up: ${Audio16.rampStyleName()}`, () => {
      Audio16.cycleRamp();
      Audio16.rampStart(); Audio16.rampTo(0.85, 0.5);
      setTimeout(() => Audio16.rampBurst(), 700);
      renderCrib();
    }, "small"));
    drawer.append(opts);
    drawer.append(el("p", "tiny dim",
      "Pin any of these open for good with a Lens, bought from the Peddler."));
    c.append(drawer);
  }

  c.append(el("p", "banner",
    `Keep ${rd.keepCount()} of ${rd.dealt.length}. The other ${rd.dealt.length - rd.keepCount()} are thrown to your Crib.`));

  // dealt cards
  const hand = el("div", "hand cribhand");
  rd.dealt.forEach((card, i) => {
    const n = cbCard(card);
    n.dataset.i = i;
    if (Cb.keep.includes(i)) n.classList.add("sel");
    else {
      n.classList.add("tocrib");
      if (Cb.keep.length === rd.keepCount()) {
        n.classList.add("throwing");
        const full = rd.crib.length >= CRIB_SIZE;
        const tag = el("div", "throwtag" + (full ? " burn" : ""), full ? "BURNED" : "→ CRIB");
        n.appendChild(tag);
      }
    }
    n.onclick = () => cribToggle(i);
    if (Cb.dealAnim) {
      n.classList.add("dealin");
      n.style.animationDelay = (i * 70) + "ms";
      setTimeout(() => sfx16("deal"), i * 70);
    }
    hand.append(n);
  });
  c.append(hand);
  if (Cb.dealAnim) Cb.dealAnim = false;

  // live preview: locked-in points vs expected value of the cut
  const need = rd.keepCount();
  if (Cb.keep.length === need) {
    const p = rd.preview(Cb.keep);
    const box = el("div", "panel col tight");
    if (p.blind) {
      for (const e of p.events) box.append(rowLR(e.label, `+${e.points}`, "blue"));
      if (!p.events.length) box.append(el("p", "small dim", "Nothing locked in yet."));
      box.append(rowLR("LOCKED IN", String(p.sure), "green"));
      box.append(rowLR("EXPECTED AFTER CUT", p.ev.toFixed(1), "gold"));
      box.append(el("p", "small dim",
        "The cut is unknown. Higher expected value beats higher certainty."));
    } else {
      for (const e of p.events) box.append(rowLR(e.label, `+${e.points}`, "blue"));
      if (p.levelBonus) box.append(rowLR("Category levels", `+${p.levelBonus}`, "gold"));
      box.append(rowLR("Base × Mult", `${p.base} × ${p.mult.toFixed(2)}`, "gold"));
      box.append(rowLR("SCORE", String(p.total), "green"));
      if (p.fired.length) box.append(el("p", "small gold", p.fired.join(" · ")));
    }
    c.append(box);
  } else {
    c.append(el("div", "selcount",
      `${Cb.keep.length} / ${need} kept — select ${need - Cb.keep.length} more`));
  }

  if (rd.score >= rd.target) {
    const co = btn(`CASH OUT  ·  +${rd.dealsLeft * 4 + rd.mulligansLeft * 3} bonus Glim`, () => {
      rd.cashOut(); sfx16("win"); cribRoundEnd();
    }, "big");
    co.classList.add("cashout");
    c.append(co);
  }
  const go = btn("COUNT IT", doCribCount, "big");
  go.disabled = Cb.keep.length !== need;
  c.append(go);


  const mull = btn(`MULLIGAN  (${rd.mulligansLeft})`, () => {
    if (!rd.mulligan()) { sfx16("bad"); return; }
    Cb.keep = []; Cb.dealAnim = true;
    sfx16("toCrib");
    renderCrib();
  }, "small");
  mull.disabled = rd.mulligansLeft <= 0 || rd.stock.length < rd.dealtCount();
  c.append(mull);


  root().append(c);
}

function cribToggle(i) {
  const rd = Cb.round;
  const at = Cb.keep.indexOf(i);
  if (at >= 0) Cb.keep.splice(at, 1);
  else {
    if (Cb.keep.length >= rd.keepCount()) { sfx16("bad"); return; }
    Cb.keep.push(i);
  }
  sfx16("select");
  renderCrib();
}

/* ---------------------------------------------------------------- cascade */
function doCribCount() {
  const rd = Cb.round;
  if (Cb.keep.length !== rd.keepCount()) return;
  const rank = rd.keepRank(Cb.keep);
  const keptCards = Cb.keep.map((i) => rd.dealt[i]);
  const knew = !!rd.starter;

  document.querySelectorAll(".cribhand .card.throwing").forEach((n, i) => {
    n.classList.add("flytocrib");
    n.style.animationDelay = (i * 90) + "ms";
    setTimeout(() => sfx16("place"), i * 90);
  });
  // rank the cut against every card that was still live, BEFORE the deal consumes them
  const preStock = rd.stock.slice();
  const res = rd.commit(Cb.keep.slice());
  if (!res) return;
  Cb.keep = [];
  Cb.optimalStreak = (rank && rank.rank === 1) ? (Cb.optimalStreak || 0) + 1 : 0;
  announceDeeds(Achv.check("count", {
    total: res.total, base: res.base,
    perfect: res.base >= 29 && !res.levelBonus && !res.enhBase,
    cutJack: rd.starter && rd.starter.rank === 11,
    cutSaved: res.crossedTarget && res.scoreBefore + res.handOnly < rd.target,
    optimalStreak: Cb.optimalStreak,
  }));
  const starter = rd.liveStarter(keptCards);
  const scoreBefore = rd.score - res.total;
  const liveStock = rd.stock;
  rd.stock = preStock;
  const quality = rd.cutQuality(keptCards, starter);
  rd.stock = liveStock;

  const go = () => cribCascade(res, rank, keptCards, starter, scoreBefore, () => {
    if (rd.dealsLeft > 0 && rd.score < rd.target) {
      rd.newDeal(); Cb.dealAnim = true; renderCrib();
    } else cribRoundEnd();
  });

  if (knew) return go();
  cutCeremony(starter, quality, go);
}

/* The reveal, tiered by how lucky the cut actually was.
   A better card rolls LONGER before it lands — so a long roll becomes a tell, and
   the wait itself turns into hope. */
const CUT_TIERS = {
  cold:    { roll: 520,  word: "",        cls: "ct-cold",  pips: 0,  shake: 3,  ramp: 0.35, shine: 0 },
  okay:    { roll: 780,  word: "OKAY",    cls: "ct-okay",  pips: 8,  shake: 5,  ramp: 0.55, shine: 1 },
  good:    { roll: 1080, word: "GOOD",    cls: "ct-good",  pips: 18, shake: 8,  ramp: 0.75, shine: 1 },
  great:   { roll: 1460, word: "GREAT",   cls: "ct-great", pips: 30, shake: 12, ramp: 0.92, shine: 2 },
  perfect: { roll: 2000, word: "THE BEST CARD IN THE DECK",
             cls: "ct-perfect", pips: 52, shake: 18, ramp: 1.0, shine: 3 },
};

function cutSound(tier) {
  const V = (f, d, o) => Audio16.voice(f, d, o);
  if (tier === "cold") {
    V(160, 0.34, { type: "triangle", gain: 0.10 });
    V(190, 0.30, { type: "sawtooth", gain: 0.05, delay: 0.03 });   // sour minor 2nd
  } else if (tier === "okay") {
    [392, 587].forEach((f, i) => V(f, 0.28, { type: "square", gain: 0.09, delay: i * 0.05, send: 0.3 }));
  } else if (tier === "good") {
    [392, 494, 587].forEach((f, i) =>
      V(f, 0.40, { type: "square", gain: 0.095, delay: i * 0.055, send: 0.38, detune: 8 }));
    Audio16.kick({ gain: 0.3 });
  } else if (tier === "great") {
    [523, 659, 784, 1047].forEach((f, i) =>
      V(f, 0.55, { type: "square", gain: 0.10, delay: i * 0.055, send: 0.45, detune: 10 }));
    [1319, 1568].forEach((f, i) => V(f, 0.3, { type: "square", gain: 0.05, delay: 0.26 + i * 0.06 }));
    Audio16.kick({ gain: 0.42 });
  } else {
    // perfect: a full rising fanfare that keeps going a beat longer than you expect
    [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) =>
      V(f, 0.7, { type: "square", gain: 0.10, delay: i * 0.07, send: 0.5, detune: 12 }));
    [261, 392].forEach((f, i) => V(f, 1.1, { type: "triangle", gain: 0.09, delay: i * 0.05 }));
    Audio16.kick({ gain: 0.55 });
    Audio16.snare({ delay: 0.5, gain: 0.3 });
  }
}

function cutCeremony(starter, quality, done) {
  const T = CUT_TIERS[quality.tier] || CUT_TIERS.okay;
  screen("cut");
  const c = el("div", "col center cutwrap");
  c.append(el("p", "dim", "THE CUT"));

  const holder = el("div", "cutholder");
  const back = backEl(2.2);
  back.classList.add("cutspin");
  holder.append(back);
  c.append(holder);

  const sub = el("p", "small dim", "…");
  c.append(sub);
  root().append(c);

  // roll: strikes tighten and the pitch steps up as the wait stretches
  Audio16.rampStart();
  let n = 0;
  const roll = setInterval(() => {
    const prog = Math.min(1, (n * 90) / T.roll);
    Audio16.noise(0.045, { freq: 1900 + n * 90, gain: 0.05 });
    Audio16.voice(280 + n * 34, 0.045, { gain: 0.04, type: "square" });
    Audio16.rampTo(T.ramp * prog, 0.1);
    // the longer it runs, the more the card shakes with it
    back.style.transform = `rotate(${(Math.random() * 2 - 1) * (2 + prog * 5)}deg)`;
    n++;
  }, 90);

  setTimeout(() => {
    clearInterval(roll);
    holder.innerHTML = "";
    const face = cardEl(starter, 2.2);
    face.classList.add("cutreveal", T.cls);
    if (T.shine) {
      const sh = el("div", "shine s" + T.shine);
      face.appendChild(sh);
    }
    holder.append(face);

    Audio16.rampBurst();
    cutSound(quality.tier);
    Juice.shake(T.shake, 300);
    if (T.pips) {
      const r = holder.getBoundingClientRect();
      Juice.burst(r.left + r.width / 2, r.top + r.height / 2, T.pips,
        quality.tier === "perfect" ? ["gold", "white", "green"]
          : quality.tier === "great" ? ["gold", "white"] : ["blue", "white"]);
    }

    if (T.word) {
      const w = el("h2", "cutword " + T.cls, T.word);
      c.append(w);
    }
    sub.textContent = quality.gain > 0
      ? `+${quality.gain} from the cut  ·  ${quality.rank} of ${quality.of} possible`
      : `nothing from the cut  ·  ${quality.rank} of ${quality.of} possible`;
    sub.className = "small " + (quality.gain > 0 ? "gold" : "dim");

    if (quality.tier === "perfect") {
      Audio16.duck(0.4, 0.1, 1.2);
      setTimeout(() => Juice.burst(window.innerWidth / 2, window.innerHeight * 0.35, 40,
        ["gold", "white", "green"]), 260);
    }
    setTimeout(done, quality.tier === "perfect" ? 1500 : 780);
  }, T.roll);
}

function cribRoundEnd() {
  const rd = Cb.round, run = Cb.run;
  const cribRes = rd.cribResult || rd.settleCrib();
  rd.settle();
  sfx16(rd.won ? "win" : "lose");

  screen("cribEnd");
  const c = el("div", "col center");

  if (rd.wager) {
    if (rd.wagerWon) {
      const locked = Achv.lockedSystems();
      if (locked.length) {
        Achv.grantSystem(locked[0].id);
        setTimeout(() => announceSystem(locked[0]), 500);
      }
    }
  }
  let head = rd.won ? "ROUND CLEARED" : "RUN OVER";
  if (rd.wager) head = rd.wagerWon ? `EXACTLY ${rd.target}` : `MISSED BY ${Math.abs(rd.margin)}`;
  let headCls = rd.won ? "title" : "title red";
  if (rd.narrow) { head = `CLEARED BY ${rd.margin}`; headCls = "title narrowwin"; }
  if (rd.soClose) { head = `${-rd.margin} SHORT`; headCls = "title soclose"; }
  c.append(el("h2", headCls, head));
  if (rd.narrow) { Juice.shake(6, 300); Audio16.sfx("milestone"); }

  // the counterfactual — "you would have lost without this"
  announceDeeds(Achv.check("round", {
    won: rd.won, act: run.act, round: run.round, score: rd.score, target: rd.target,
    deckSize: run.deckSize(), cribTotal: (rd.cribResult && rd.cribResult.total) || 0,
    maxReckoning: Math.max(...Object.values(run.levels)),
    hallowed: run.charms.filter((x) => x.rarity === "legendary").length,
    shattered: (rd.shatteredAll || []).length,
    actCleared: rd.won && run.round === CRIB_ROUNDS,
  }));
  const m = rd.mvp();
  if (m) {
    const box = el("div", "panel col tight " + (m.decisive ? "mvpbox decisive" : "mvpbox"));
    box.append(el("div", "small dim", m.decisive ? "THIS WON YOU THE ROUND" : "BIGGEST CONTRIBUTOR"));
    box.append(el("div", "mvpname", m.name));
    box.append(el("div", "small gold", `+${Math.round(m.points)} points`));
    if (m.decisive)
      box.append(el("div", "small red",
        `Without it you'd have finished on ${Math.round(m.without)} — you needed ${rd.target}.`));
    c.append(box);
    if (m.decisive) {
      Audio16.sfx("milestone");
      Juice.burst(window.innerWidth / 2, window.innerHeight * 0.35, 26, ["gold", "white"]);
    }
  }
  const box = el("div", "panel col tight");
  if (rd.shatteredAll && rd.shatteredAll.length) {
    box.append(el("p", "small glassbreak",
      `Shattered: ${rd.shatteredAll.map((x) => CRANK_LABEL[x.rank] + SUIT_SYM[x.suit]).join(", ")}`));
  }
  if (rd.coinsAll) box.append(rowLR("Minted cards", `+${rd.coinsAll} Glim`, "green"));
  Audio16.setProximity(Math.min(1, rd.score / rd.target));
  const cribShow = el("div", "cribrow center");
  for (const cc of rd.crib.slice(0, 8)) cribShow.append(cardEl(cc, 0.9));
  if (rd.crib.length) { box.append(el("p", "small gold", "YOUR CRIB")); box.append(cribShow); }
  if (cribRes.events && cribRes.events.length)
    box.append(el("p", "small dim", cribRes.events.map((e) => e.label).join(", ")));
  box.append(rowLR("The Crib pays", `+${cribRes.total}`, "gold"));
  (cribRes.events || []).forEach((_, i) => setTimeout(() => Audio16.cribTick(i), 120 + i * 160));
  if (cribRes.events && cribRes.events.length)
    box.append(el("p", "small dim", cribRes.events.map((e) => e.label).join(", ")));
  if (rd.outOfCards) box.append(el("p", "small red", "Your deck ran out."));
  box.append(rowLR("Final score", `${rd.score} / ${rd.target}`, rd.won ? "green" : "red"));
  if (rd.won) box.append(rowLR("Essence", `+${rd.essenceEarned}`, "gold"));
  c.append(box);

  if (!rd.won) {
    const m = Meta.record(run, run.roundIndex() - 1, rd.score);
    c.append(el("p", "dim", `Reached Act ${run.act}, Round ${run.round}.`));
    c.append(el("p", "small gold", Meta.line()));
    c.append(btn("New Run", showCribSelect, "big"));
    c.append(btn("Title", showTitle, "small"));
  } else {
    run.essence += rd.essenceEarned;
    c.append(btn("SHOP", () => { run.openShop(); showCribShop(); }, "big"));
  }
  root().append(c);
}

/* A result card built to be screenshotted. Short, legible, and it leads with the
   emotional beat rather than the stats — that's what gets shared. */
function shareCard(run, rd) {
  const box = el("div", "panel col tight sharecard");
  const m = rd.mvp();
  const rm = run.runMVP();
  box.append(el("div", "sharehead", "MELDLINGS"));
  box.append(el("div", "small dim",
    `${CRIB_DECKS[run.meldling].name} ${SUIT_SYM[CRIB_DECKS[run.meldling].suit]}  ·  Act ${run.act}-${run.round}`));
  const big = el("div", "sharescore", `${rd.score} / ${rd.target}`);
  box.append(big);
  if (rd.soClose) box.append(el("div", "soclose small", `${-rd.margin} SHORT`));
  if (m && m.decisive) box.append(el("div", "small gold", `Carried by ${m.name}`));
  else if (rm) box.append(el("div", "small gold", `Run MVP: ${rm.name}`));
  const charmLine = run.charms.map((ch) => ch.name).join(" · ") || "no charms";
  box.append(el("div", "small dim", charmLine));

  const copy = btn("COPY RESULT", () => {
    const txt = [
      `MELDLINGS — ${CRIB_DECKS[run.meldling].name} ${SUIT_SYM[CRIB_DECKS[run.meldling].suit]}`,
      `Act ${run.act}-${run.round}   ${rd.score}/${rd.target}` + (rd.soClose ? `  (${-rd.margin} short!)` : ""),
      m && m.decisive ? `Carried by ${m.name}` : (rm ? `MVP ${rm.name}` : ""),
      charmLine,
    ].filter(Boolean).join("\n");
    try {
      navigator.clipboard.writeText(txt);
      flash("Result copied");
    } catch (e) { flash("Copy unavailable"); }
    sfx16("buy");
  }, "small");
  box.append(copy);
  return box;
}

function showCribShop() {
  Audio16.playMusic("menu");
  const run = Cb.run;
  if (!run.shopState) run.openShop();
  screen("cribShop");
  const c = el("div", "col");

  const head = el("div", "panel col tight");
  head.append(rowLR("THE PEG HOUSE", `${run.essence} Glim`, "gold"));
  head.append(el("p", "small dim",
    `Act ${run.act}-${run.round} cleared  ·  deck ${run.deckSize()} cards  ·  ` +
    `charms ${run.charms.length}/${run.slots()}`));
  c.append(head);

  c.append(el("p", "small gold", "YOUR CHARMS  (tap × to sell)"));
  c.append(cribCharmRow(run, {
    onSell: (ch) => {
      const got = run.sell(ch.id);
      sfx16("place");
      Juice.burst(window.innerWidth / 2, window.innerHeight * 0.25, 8, ["gold"]);
      flash(`Pawned ${ch.name} for ${got} Glim`);
      showCribShop();
    },
  }));

  // ---- charm offers
  const offHead = el("div", "row between");
  offHead.append(el("span", "sechead", "CHARMS ON OFFER"));
  const rr = btn(`Reroll  ${run.rerollCost()}`, () => {
    if (run.reroll()) { sfx16("cut"); showCribShop(); } else sfx16("bad");
  }, "small");
  rr.disabled = run.essence < run.rerollCost();
  rr.classList.add("rrbtn");
  offHead.append(rr);
  c.append(offHead);

  const full = run.isFull();
  for (const ch of run.shopState.offer) {
    if (run.charms.some((x) => x.id === ch.id)) continue;
    const rar = ch.rarity || "common";
    const b = el("button", `shopitem r-${rar}`);
    const gem = el("div", "shopgem");
    if (ART.rarity && ART.rarity[rar]) gem.style.backgroundImage = `url(${ART.rarity[rar]})`;
    const l = el("div", "col tight grow");
    const title = el("div", "row between");
    title.append(el("span", "shoptitle", ch.name),
                 el("span", "raritytag r-" + rar, RARITY[rar].name));
    l.append(title, el("div", "small dim", ch.text));
    b.append(gem, l, el("div", "cost", String(ch.cost)));
    b.disabled = ch.cost > run.essence || full;
    b.onclick = () => {
      if (ch.cost > run.essence || run.isFull()) { sfx16("bad"); return; }
      run.essence -= ch.cost;
      run.charms.push(ch);
      if (ch.onAcquire) ch.onAcquire(run);
      sfx16(rar === "legendary" ? "milestone" : "buy");
      Juice.burst(window.innerWidth / 2, window.innerHeight * 0.4,
        rar === "legendary" ? 30 : 12,
        rar === "legendary" ? ["gold", "white", "green"] : ["gold", "white"]);
      run.shopState.offer = run.shopState.offer.filter((x) => x.id !== ch.id);
      showCribShop();
    };
    c.append(b);
  }
  if (full) c.append(el("p", "small red", "Every charm slot is spoken for — pawn one first."));

  // ---- the card market
  c.append(sectionHead("THE STALL", "take a card into your deck"));
  c.append(el("p", "small dim",
    "Fives are scarce and dear — a five makes fifteen with every court card."));
  const mrow = el("div", "row gap cardmarket");
  for (const entry of run.shopState.cards) {
    if (entry.sold) continue;
    const slot = el("div", "marketslot");
    slot.append(cardEl(entry.card, 1.05));
    const meta = entry.card.enh ? ENHANCEMENTS[entry.card.enh] : null;
    slot.append(el("div", "small " + (meta ? "gold" : "dim"), meta ? meta.name : "unmarked"));
    const b = btn(String(entry.cost), () => {
      if (run.buyCard(entry)) {
        entry.sold = true;
        sfx16(entry.card.enh ? "buy" : "place");
        Juice.burst(window.innerWidth / 2, window.innerHeight * 0.55,
          entry.card.enh ? 16 : 8, ["gold", "white"]);
        flash(`Added ${CRANK_LABEL[entry.card.rank]}${SUIT_SYM[entry.card.suit]} to your deck`);
        showCribShop();
      } else sfx16("bad");
    }, "small");
    b.disabled = run.essence < entry.cost;
    slot.append(b);
    if (meta) tip(slot, meta.name, meta.text);
    mrow.append(slot);
  }
  if (!mrow.children.length) mrow.append(el("p", "small dim", "The stall is bare."));
  c.append(mrow);

  // ---- category levels
  c.append(sectionHead("RECKONINGS", "study a count, forever"));
  const grid = el("div", "lvgrid");
  for (const cat of LEVEL_CATS) {
    const cost = run.levelCostFor(cat);
    const b = el("button", "lvbtn");
    tip(b, `Reckoning: ${cat}`, `+${LEVEL_GAIN} base for every ${cat} you score, each level. Costs ${cost} Glim.`);
    const ic = el("div", "lvicon2");
    if (ART.icons && ART.icons[cat]) ic.style.backgroundImage = `url(${ART.icons[cat]})`;
    b.append(ic);
    b.append(el("div", "small", cat));
    b.append(el("div", "lvnum", `${run.levels[cat]} → ${run.levels[cat] + 1}`));
    b.append(el("div", "cost small", String(cost)));
    b.disabled = run.essence < cost;
    b.onclick = () => {
      if (run.buyLevel(cat)) { sfx16("level");
        Juice.burst(window.innerWidth / 2, window.innerHeight * 0.6, 10, ["gold", "green"]);
        showCribShop(); }
      else sfx16("bad");
    };
    grid.append(b);
  }
  c.append(grid);
  c.append(el("p", "small dim", `+${LEVEL_GAIN} base per scoring event of that kind, per Reckoning.`));

  c.append(el("p", "small dim",
    "Marks on cards do the rest — buy them at The Stall."));

  c.append(btn("NEXT ROUND", () => {
    run.shopState = null;
    if (run.advance()) { screen("cribWon"); return cribRunWon(); }
    cribRoundIntro();
  }, "big"));
  root().append(c);
}

/* A short, friendly first run. Teaches keep-then-cut, the Crib, the count and the
   shop in six beats, using the real screens rather than a mock. */

const Tut = { step: 0, active: false, done: false };

const TUT_STEPS = [
  { title: "Six cards, keep four",
    body: "You're dealt six. Choose the four you'll count — tap them. The other two are thrown to your Crib.",
    art: "pip", anchor: "hand" },
  { title: "Then the cut decides",
    body: "Only after you commit is a fifth card cut. It joins your four for the count — so keep for what's LIKELY, not what's certain.",
    art: "facet", anchor: "cut" },
  { title: "The Crib is yours",
    body: "Your first four thrown cards form the Crib. It scores for you at the end of the round. Feeding it well is a second skill.",
    art: "muggins", anchor: "crib" },
  { title: "Counting",
    body: "Every pair of cards adding to fifteen scores 2. Pairs score 2. Runs of three or more score their length. Flushes and his-nobs score too.",
    art: "thump", anchor: "count" },
  { title: "Charms and Marks",
    body: "Charms multiply your count. Marks sit on individual cards. Buy both at the Peg House between rounds — you have five charm slots, so choose.",
    art: "clover", anchor: "shop" },
  { title: "Spoilers",
    body: "Every fifth round is a Spoiler with a rule that breaks something. You can see all five at the start of a run — build for them.",
    art: "kingpin", anchor: "boss" },
];

function showTutorial() {
  Tut.active = true;
  Tut.step = 0;
  renderTutStep();
}

function renderTutStep() {
  const st = TUT_STEPS[Tut.step];
  if (!st) {
    Tut.active = false;
    try {
      const m = Achv.load(); m.tutorial = 1; Achv.save(m);
    } catch (e) {}
    return showCribSelect();
  }
  screen("tutorial");
  const c = el("div", "col center tutwrap");

  const pips = el("div", "row gap tutpips");
  TUT_STEPS.forEach((_, i) => {
    const d = el("div", "tutpip" + (i === Tut.step ? " on" : i < Tut.step ? " past" : ""));
    pips.append(d);
  });
  c.append(pips);

  const cre = creatureEl(st.art, "idle", 4);
  cre.classList.add("tutcre");
  c.append(cre);

  const box = el("div", "panel col tight tutbox");
  box.append(el("div", "tuttitle", st.title));
  box.append(el("div", "tutbody", st.body));
  c.append(box);

  c.append(tutVisual(st.anchor));

  const row = el("div", "row gap");
  if (Tut.step > 0)
    row.append(btn("Back", () => { Tut.step--; sfx16("click"); renderTutStep(); }, "small"));
  row.append(btn(Tut.step === TUT_STEPS.length - 1 ? "PLAY" : "Next", () => {
    Tut.step++;
    sfx16(Tut.step >= TUT_STEPS.length ? "buy" : "select");
    renderTutStep();
  }, "big"));
  c.append(row);
  c.append(btn("Skip", () => { Tut.step = TUT_STEPS.length; renderTutStep(); }, "small"));
  root().append(c);
}

/* A tiny live illustration per beat — real cards, not screenshots. */
function tutVisual(anchor) {
  const wrap = el("div", "row center gap tutvis");
  const C = (r, s, enh) => { const o = { rank: r, suit: s }; if (enh) o.enh = enh; return o; };
  if (anchor === "hand") {
    [C(5, "H"), C(5, "S"), C(10, "C"), C(11, "D"), C(2, "S"), C(9, "H")]
      .forEach((cd, i) => {
        const n = cardEl(cd, 0.95);
        if (i < 4) n.classList.add("sel"); else n.classList.add("tocrib");
        wrap.append(n);
      });
  } else if (anchor === "cut") {
    [C(5, "H"), C(5, "S"), C(10, "C"), C(11, "D")].forEach((cd) => wrap.append(cardEl(cd, 0.95)));
    const back = backEl(0.95); back.classList.add("cutwait");
    wrap.append(back);
  } else if (anchor === "crib") {
    [C(2, "S"), C(9, "H")].forEach((cd) => wrap.append(cardEl(cd, 0.95)));
    wrap.append(el("div", "small gold", "→ your Crib"));
  } else if (anchor === "count") {
    const t = el("div", "col tight");
    [["Fifteen 2", "+2"], ["Fifteen 4", "+2"], ["Pair of 5s", "+2"], ["Run of 3", "+3"]]
      .forEach(([a, b]) => {
        const r = el("div", "row between casrow");
        r.append(el("span", "grow", a), el("span", "casval", b));
        t.append(r);
      });
    wrap.append(t);
  } else if (anchor === "shop") {
    [C(5, "H", "gilded"), C(7, "C", "glass"), C(12, "S", "coin")]
      .forEach((cd) => wrap.append(cardEl(cd, 0.95)));
  } else if (anchor === "boss") {
    for (const b of ["deadwood", "shuffler", "jokester"]) wrap.append(creatureEl(b, "idle", 2));
  }
  return wrap;
}

/* The Gallery — every asset in the game, in one place.
   Doubles as a collection screen and as the fastest way to spot a missing or
   broken asset without hunting through a run. */

const GAL = { tab: "cards" };
const GAL_TABS = [
  ["cards",   "Cards"],
  ["split",   "Split"],
  ["marks",   "Marks"],
  ["backs",   "Backs"],
  ["meld",    "Meldlings"],
  ["spoil",   "Spoilers"],
];

function showGallery() {
  Audio16.playMusic("menu");
  screen("gallery");
  const c = el("div", "col");
  c.append(el("h2", "title", "THE GALLERY"));

  const tabs = el("div", "row gap wrap galtabs");
  for (const [id, label] of GAL_TABS) {
    const b = el("button", "galtab" + (GAL.tab === id ? " on" : ""), label);
    b.onclick = () => { GAL.tab = id; sfx16("click"); showGallery(); };
    tabs.append(b);
  }
  c.append(tabs);

  const body = el("div", "col tight");
  ({ cards: galCards, split: galSplit, marks: galMarks,
     backs: galBacks, meld: galMeld, spoil: galSpoil }[GAL.tab] || galCards)(body);
  c.append(body);

  c.append(btn("Back", showCribSelect, "small"));
  root().append(c);
}

function galNote(box, txt) { box.append(el("p", "small dim galnote", txt)); }

function galCards(box) {
  galNote(box, "All 52 faces. Every card in the game is generated, not drawn by hand.");
  for (const suit of ["S", "H", "C", "D"]) {
    box.append(el("p", "small gold", `${SUIT_SYM[suit]}  ${
      { S: "Spades", H: "Hearts", C: "Clubs", D: "Diamonds" }[suit]}`));
    const row = el("div", "galgrid");
    for (let r = 1; r <= 13; r++) {
      const w = el("div", "galcell");
      w.append(cardEl({ rank: r, suit }, 0.62));
      row.append(w);
    }
    box.append(row);
  }
}

function galSplit(box) {
  galNote(box, "Split cards count as either rank. Four shared images compose all " +
    "2,704 combinations — nothing here is a pre-rendered asset.");
  const samples = [
    [2, 3, "H", "H"], [1, 13, "S", "D"], [10, 11, "C", "C"], [5, 9, "D", "S"],
    [7, 8, "H", "S"], [4, 12, "C", "H"], [6, 6, "D", "D"], [3, 10, "S", "C"],
  ];
  const row = el("div", "galgrid");
  for (const [a, b, s1, s2] of samples) {
    const w = el("div", "galcell");
    w.append(cardEl({ rank: a, rank2: b, suit: s1, suit2: s2 }, 0.72));
    w.append(el("div", "tiny dim", `${CRANK_LABEL[a]}/${CRANK_LABEL[b]}`));
    row.append(w);
  }
  box.append(row);

  const roll = btn("Roll eight more", () => {
    sfx16("cut");
    showGallery();
  }, "small");
  box.append(roll);

  box.append(el("p", "small gold", "How it scores"));
  const demo = el("div", "panel col tight");
  demo.append(el("div", "small",
    "A hand of [2/3] 4 5 10 with a 6 cut scores 8 — the split takes the 3 to " +
    "complete a run of four. Held as a 2 it would score 7."));
  box.append(demo);
}

function galMarks(box) {
  galNote(box, "Marks sit on individual cards and change what they do.");
  for (const k of Object.keys(ENHANCEMENTS)) {
    const m = ENHANCEMENTS[k];
    const row = el("div", "row gap galrow");
    row.append(cardEl({ rank: 5, suit: "H", enh: k }, 0.6));
    const t = el("div", "col tight grow");
    t.append(el("div", "gold", m.name));
    t.append(el("div", "small dim", m.text));
    row.append(t);
    box.append(row);
  }
}

function galBacks(box) {
  galNote(box, "Card backs, bought from the Peddler with Pegs. Tap an owned back to equip it.");
  const row = el("div", "galgrid");
  for (const b of CARD_BACKS) {
    const owned = Achv.ownsBack(b.id);
    const w = el("div", "galcell" + (Achv.activeBack() === b.id ? " on" : ""));
    const img = el("div", "galback");
    if (ART.backs && ART.backs[b.id]) img.style.backgroundImage = `url(${ART.backs[b.id]})`;
    if (!owned) img.classList.add("locked");
    w.append(img);
    w.append(el("div", "tiny " + (owned ? "gold" : "dim"), owned ? b.name : `${b.cost} Pegs`));
    if (owned) w.onclick = () => { Achv.setBack(b.id); sfx16("select"); showGallery(); };
    row.append(w);
  }
  box.append(row);
}

function galMeld(box) {
  galNote(box, "Six Meldlings. Two are earned.");
  for (const id of Object.keys(CRIB_DECKS)) {
    const d = CRIB_DECKS[id];
    const open = Achv.meldlingUnlocked(id);
    const row = el("div", "row gap galrow" + (open ? "" : " dimmed"));
    row.append(creatureEl(id, "idle", 2));
    const t = el("div", "col tight grow");
    t.append(el("div", open ? "gold" : "dim", open ? `${d.name} ${SUIT_SYM[d.suit]}` : "???"));
    t.append(el("div", "small dim", open ? d.text : "Locked."));
    row.append(t);
    box.append(row);
  }
}

function galSpoil(box) {
  galNote(box, `All ${BOSS_POOL.length} Spoilers. Five are drawn per run, so no two runs meet the same set.`);
  for (const sev of [1, 2, 3]) {
    box.append(el("p", `small sev${sev}`,
      ["", "THREAT", "SEVERE", "RUINOUS"][sev]));
    for (const b of BOSS_POOL.filter((x) => x.sev === sev)) {
      const row = el("div", "row gap galrow");
      const cre = creatureEl(b.art, "idle", 1.6);
      cre.style.filter = `hue-rotate(${(b.id.charCodeAt(0) * 37) % 360}deg) saturate(${1 + sev * 0.35})`;
      row.append(cre);
      const t = el("div", "col tight grow");
      t.append(el("div", `sev${sev}`, b.name + (b.align ? `  ${SUIT_SYM[b.align]}` : "")));
      t.append(el("div", "small dim", b.text));
      row.append(t);
      box.append(row);
    }
  }
}

</script>
