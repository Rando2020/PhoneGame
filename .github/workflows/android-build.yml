name: Android build

# Builds an unsigned Android App Bundle (.aab) of the real game from the
# "Android" preset: Godot 4.3 Gradle build, arm64-v8a and armeabi-v7a.
# Unsigned on purpose: Google Play App Signing re-signs it, and the upload key
# is Ziah's (FINISH_LINE, After launch). The .aab is uploaded as an artifact.
# No secrets, no publishing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "godot/export_presets.cfg"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: JDK 17 and the Android SDK pieces Godot 4.3's template needs
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Godot 4.3 and the Android export templates (official release, SHA-512 checked)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          bin="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          for f in "$bin" "$tpz"; do
            curl -L --fail --retry 3 -o "$f" "$base/$f"
            awk -v file="$f" '$2 == file || $2 == "*" file {print}' SHA512-SUMS.txt > sel.sha512
            test "$(wc -l < sel.sha512)" -eq 1
            sha512sum -c sel.sha512
          done
          unzip -q "$bin"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q -j "$tpz" templates/android_source.zip templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$tdir"
          rm "$tpz"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import the project and point Godot at the JDK and SDK
        run: |
          timeout 600 "$GODOT" --headless --path godot --editor --import
          s="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          test -f "$s"
          # set both paths whether or not the first run filled them
          grep -v -e '^export/android/java_sdk_path' -e '^export/android/android_sdk_path' "$s" > "$s.new"
          printf 'export/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" >> "$s.new"
          mv "$s.new" "$s"
          grep '^export/android/.*_sdk_path' "$s"

      - name: Export "Android" (unsigned .aab)
        run: |
          mkdir -p build/android
          timeout 1800 "$GODOT" --headless --path godot --install-android-build-template --export-release "Android" ../build/android/Meldlings.aab 2>&1 | tee export.log
          test -s build/android/Meldlings.aab
          if grep -E "^ERROR|SCRIPT ERROR|BUILD FAILED" export.log; then exit 1; fi
          # both ABIs, the game data, and no signature
          unzip -l build/android/Meldlings.aab > list.txt
          grep -q "base/lib/arm64-v8a/libgodot_android.so" list.txt
          grep -q "base/lib/armeabi-v7a/libgodot_android.so" list.txt
          if grep -iE "META-INF/[^/]*\.(RSA|DSA|EC|SF)$" list.txt; then echo "signed: expected unsigned"; exit 1; fi
          echo "Meldlings.aab: $(stat -c %s build/android/Meldlings.aab) bytes"

      - name: Upload the .aab
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meldlings-android-aab-unsigned
          path: build/android/Meldlings.aab
          retention-days: 14
          if-no-files-found: error
