name: Godot 4.6.2 Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.2
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.2-stable_linux.x86_64

      - name: Validate project with Godot 4.6.2
        run: |
          ./Godot_v4.6.2-stable_linux.x86_64 --version
          ./Godot_v4.6.2-stable_linux.x86_64 --headless --path . --editor --quit
