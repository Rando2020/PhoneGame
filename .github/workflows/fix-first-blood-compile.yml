name: Fix First Blood Compile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-first-blood-compile.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch strict typing warnings
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/main.gd')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'var name := rules.action_name(action)\n\t_log("[color=#ffd166][b]%s![/b][/color] %s" % [name, _cards_text(cards)])':
                  'var action_label: String = rules.action_name(action)\n\t_log("[color=#ffd166][b]%s![/b][/color] %s" % [action_label, _cards_text(cards)])',
              'func _apply_player_suit_offense(cards: Array, action: int) -> void:':
                  'func _apply_player_suit_offense(cards: Array, _action: int) -> void:',
              'var blocked := min(player_block, amount)\n\tplayer_block -= blocked\n\tvar dealt := amount - blocked':
                  'var blocked: int = mini(player_block, amount)\n\tplayer_block -= blocked\n\tvar dealt: int = amount - blocked',
              'var blocked := min(cpu_block, amount)\n\tcpu_block -= blocked\n\tvar dealt := amount - blocked':
                  'var blocked: int = mini(cpu_block, amount)\n\tcpu_block -= blocked\n\tvar dealt: int = amount - blocked',
              'func _choose_relic(name: String) -> void:\n\tif not relics.has(name): relics.append(name)\n\t_start_battle()\n\t_log("Relic active: [color=#ffd166]%s[/color]." % name)':
                  'func _choose_relic(relic_name: String) -> void:\n\tif not relics.has(relic_name): relics.append(relic_name)\n\t_start_battle()\n\t_log("Relic active: [color=#ffd166]%s[/color]." % relic_name)',
              'func _label(text: String, size: int, color: Color) -> Label:\n\tvar label := Label.new()\n\tlabel.text = text\n\tlabel.add_theme_font_size_override("font_size", size)':
                  'func _label(text: String, font_size: int, color: Color) -> Label:\n\tvar label := Label.new()\n\tlabel.text = text\n\tlabel.add_theme_font_size_override("font_size", font_size)',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected source pattern missing: {old[:80]}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Install Godot 4.7.1
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Parse project headlessly
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          git diff --cached --quiet && exit 0
          git commit -m "fix Godot strict typing compile errors"
          git push
